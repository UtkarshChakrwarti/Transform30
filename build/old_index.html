<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transform30 — 30-Day Extreme Transformation Planner (Gym + Home, Diet, Tracker)</title>
<meta name="description" content="A research-backed 30-day transformation program with one rest day every week. Gym and home workout versions for every day, personalised diet macros, safety precautions, progress tracking. Works offline and saves to your browser.">
<meta name="theme-color" content="#0b0a14">
<style>
:root{
  --bg:hsl(252 32% 6%);
  --bg2:hsl(252 28% 9%);
  --card:hsl(252 24% 12% / .72);
  --card-solid:hsl(252 24% 12%);
  --line:hsl(252 20% 22% / .8);
  --txt:hsl(250 30% 96%);
  --mut:hsl(250 14% 68%);
  --a1:hsl(268 92% 68%);
  --a2:hsl(158 84% 52%);
  --a3:hsl(20 96% 62%);
  --a4:hsl(205 95% 62%);
  --bad:hsl(0 88% 66%);
  --warn:hsl(42 96% 58%);
  --r:18px;
  --shadow:0 10px 40px -12px hsl(268 90% 40% / .45);
  font-family:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(900px 500px at 10% -10%, hsl(268 90% 30% / .55), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, hsl(158 80% 25% / .35), transparent 60%),
    radial-gradient(700px 600px at 50% 110%, hsl(20 90% 30% / .25), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt);min-height:100vh;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:110px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--a4)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px) saturate(1.4);background:hsl(252 32% 6% / .72);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--a1),var(--a3));box-shadow:var(--shadow)}
h1{font-size:1.15rem;letter-spacing:-.02em;font-weight:800}
h1 small{display:block;font-size:.68rem;font-weight:500;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.chip{padding:6px 12px;border-radius:999px;background:hsl(252 24% 16%);border:1px solid var(--line);font-size:.8rem;font-weight:600;white-space:nowrap}
.seg{display:inline-flex;background:hsl(252 24% 14%);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:.82rem;font-weight:700;color:var(--mut);transition:.25s}
.seg button.on{background:linear-gradient(135deg,var(--a1),hsl(290 85% 60%));color:#fff;box-shadow:0 4px 16px -4px var(--a1)}
.seg.home button.on{background:linear-gradient(135deg,var(--a2),hsl(180 80% 42%));color:#052;box-shadow:0 4px 16px -4px var(--a2)}
nav.tabs{position:sticky;top:63px;z-index:25;backdrop-filter:blur(16px);background:hsl(252 32% 6% / .6)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
nav.tabs button{padding:9px 16px;border-radius:12px;font-weight:700;font-size:.86rem;color:var(--mut);white-space:nowrap;transition:.2s}
nav.tabs button:hover{color:var(--txt);background:hsl(252 24% 14%)}
nav.tabs button.on{color:#fff;background:linear-gradient(135deg,hsl(268 70% 40%),hsl(268 60% 28%));box-shadow:inset 0 0 0 1px hsl(268 90% 68% / .5)}

/* cards */
main{padding-top:18px;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;backdrop-filter:blur(10px)}
.card h2{font-size:1.1rem;margin-bottom:4px;letter-spacing:-.01em}
.card h3{font-size:.95rem;margin:14px 0 6px}
.sub{color:var(--mut);font-size:.86rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:linear-gradient(135deg,hsl(268 60% 20% / .8),hsl(252 30% 11% / .8) 55%,hsl(158 50% 14% / .7));border-color:hsl(268 60% 40% / .5)}
.ring{width:132px;height:132px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:800;font-size:1.7rem}
.ring .v small{display:block;font-size:.65rem;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.stat{background:hsl(252 24% 10% / .7);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.45rem;letter-spacing:-.02em}
.stat span{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.b1{background:hsl(268 80% 60% / .2);color:hsl(268 100% 80%)}
.b2{background:hsl(158 80% 50% / .18);color:hsl(158 90% 70%)}
.b3{background:hsl(20 95% 60% / .2);color:hsl(20 100% 74%)}
.b4{background:hsl(205 95% 60% / .2);color:hsl(205 100% 78%)}
.bw{background:hsl(42 95% 55% / .2);color:hsl(42 100% 72%)}
.bd{background:hsl(0 90% 60% / .2);color:hsl(0 100% 78%)}

.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:.88rem;background:hsl(252 24% 18%);border:1px solid var(--line);transition:.2s}
.btn:hover{transform:translateY(-1px);border-color:var(--a1)}
.btn.pri{background:linear-gradient(135deg,var(--a1),hsl(300 80% 58%));border:0;box-shadow:var(--shadow)}
.btn.ok{background:linear-gradient(135deg,var(--a2),hsl(180 80% 40%));color:#032;border:0}
.btn.danger{border-color:hsl(0 80% 50% / .5);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* inputs */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.74rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:hsl(252 28% 8%);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.92rem;text-transform:none;letter-spacing:0;font-weight:500;color:var(--txt);outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px hsl(268 90% 68% / .2)}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{accent-color:var(--a2);width:18px;height:18px}

/* exercise */
.ex{background:hsl(252 26% 9% / .75);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;transition:.25s}
.ex.done{border-color:hsl(158 70% 45% / .6);background:hsl(158 40% 9% / .6)}
.ex-h{display:flex;gap:12px;align-items:flex-start}
.num{min-width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:linear-gradient(135deg,var(--a1),var(--a3))}
.ex h4{font-size:1rem}
.meta{font-size:.8rem;color:var(--a2);font-weight:700}
.tip{font-size:.82rem;color:var(--mut);margin:6px 0 8px 42px}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 8px 42px;align-items:center}
.setb{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);font-weight:800;background:hsl(252 28% 8%);transition:.2s}
.setb:hover{border-color:var(--a2);transform:scale(1.06)}
.setb.on{background:linear-gradient(135deg,var(--a2),hsl(180 80% 40%));color:#032;border-color:transparent;box-shadow:0 4px 14px -4px var(--a2)}
.ex .load{margin-left:42px;width:calc(100% - 42px)}
.tech{margin:4px 0 4px 42px;font-size:.78rem;color:hsl(20 100% 74%)}
.progbar{height:8px;border-radius:99px;background:hsl(252 24% 16%);overflow:hidden}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:99px;transition:width .4s}
details{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:hsl(252 24% 10% / .5)}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto;color:var(--mut)}
details[open] summary::after{content:"－"}
details ul,.card ul.l{padding-left:20px;margin-top:8px}
li{margin:4px 0;font-size:.9rem}
.note{padding:12px 14px;border-radius:12px;font-size:.86rem;margin:10px 0;border:1px solid}
.note.w{background:hsl(42 90% 50% / .1);border-color:hsl(42 90% 55% / .4)}
.note.b{background:hsl(0 90% 55% / .1);border-color:hsl(0 90% 60% / .4)}
.note.g{background:hsl(158 80% 45% / .1);border-color:hsl(158 80% 50% / .4)}
.note.i{background:hsl(205 90% 55% / .1);border-color:hsl(205 90% 60% / .4)}

/* plan grid */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.day{border:1px solid var(--line);background:hsl(252 24% 10% / .75);border-radius:14px;padding:11px;text-align:left;transition:.2s;position:relative}
.day:hover{transform:translateY(-3px);border-color:var(--a1)}
.day .n{font-weight:800;font-size:1.1rem}
.day .t{font-size:.72rem;color:var(--mut);font-weight:600}
.day .e{font-size:1.4rem;position:absolute;right:10px;top:8px}
.day.done{border-color:hsl(158 70% 45% / .7);background:hsl(158 40% 10% / .7)}
.day.today{box-shadow:0 0 0 2px var(--a3)}
.day.rest{background:hsl(42 40% 10% / .7);border-color:hsl(42 80% 50% / .5)}
.day.sel{outline:2px solid var(--a1)}
.day .ck{position:absolute;right:9px;bottom:7px;color:var(--a2);font-weight:900}

table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em}
.tw{overflow-x:auto}
td input{min-width:70px;padding:6px 8px}

/* floating */
#timer{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:50;transition:.35s;background:hsl(252 30% 12% / .95);border:1px solid var(--a1);border-radius:18px;padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);min-width:260px;backdrop-filter:blur(14px)}
#timer.show{transform:translate(-50%,0)}
#timer .tt{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums}
#timer .progbar{flex:1}
#toast{position:fixed;top:80px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:hsl(252 30% 14%);border:1px solid var(--a2);padding:10px 16px;border-radius:12px;font-size:.86rem;animation:fade .3s;box-shadow:var(--shadow)}
.big{font-size:2rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--a2),var(--a4));-webkit-background-clip:text;background-clip:text;color:transparent}
.legend span{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:.78rem;color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:640px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  nav.tabs{top:104px}
}
@media print{.top,nav.tabs,#timer,.btn{display:none}}
</style>
</head>

/* diet calc */
function calc(p){
  const w=+p.w,h=+p.h,a=+p.age;if(!(w>20&&h>100&&a>10))return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==='male'?5:-161);
  const tdee=bmr*(+p.act);
  const adj={cut:-0.20,recomp:-0.10,maint:0,bulk:0.08}[p.goal];
  let kcal=tdee*(1+adj),warn=[];
  const floor=Math.max(p.sex==='male'?1500:1200,bmr*0.95);
  if(kcal<floor){kcal=floor;warn.push('Calories were raised to a safe floor (≈ your resting energy). Do not eat lower than this.');}
  kcal=Math.round(kcal/10)*10;
  const gkg={cut:2.2,recomp:2.0,maint:1.8,bulk:1.8}[p.goal];
  const prot=Math.round(w*gkg);
  let fat=Math.round(Math.max(w*0.8,kcal*0.2/9));
  let carb=Math.round((kcal-prot*4-fat*9)/4);
  if(carb<w*2){carb=Math.round(w*2);fat=Math.round((kcal-prot*4-carb*4)/9);if(fat<w*0.6){fat=Math.round(w*0.6);warn.push('Macros are tight for this calorie level — consider a smaller deficit.');}}
  const weekly=(tdee-kcal)*7;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,carb,fat,
    fiber:Math.round(kcal/1000*14),water:+(w*0.037).toFixed(1),waterTrain:+(w*0.037+0.5).toFixed(1),
    est30:+((tdee-kcal)*30/7700).toFixed(1),pct:+(weekly/7700/w*100).toFixed(2),caff:Math.min(400,Math.round(w*3)),warn,
    rest:Math.round(tdee/10)*10};
}
function navyBF(m,p){
  const h=+p.h,w=+m.waist,n=+m.neck,hp=+m.hips;
  if(!(h&&w&&n))return null;
  let bf;
  if(p.sex==='male'){if(w<=n)return null;bf=495/(1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(h))-450;}
  else{if(!hp||w+hp<=n)return null;bf=495/(1.29579-0.35004*Math.log10(w+hp-n)+0.221*Math.log10(h))-450;}
  return isFinite(bf)?Math.max(2,Math.min(60,bf)):null;
}

  </section>`;
  if(d===1||d===30)h+=`<div class="note i">📏 <b>Benchmark day:</b> before training, log your tests (push-ups, pull-ups, squats, plank, burpees) and measurements in the <a href="#progress" data-a="nav" data-v="progress">Progress</a> tab so you can compare ${d===1?'on Day 30':'with Day 1'}.</div>`;
  /* readiness */
  const rd=p.r,lv=rd.lvl;
  h+=`<section class="card"><h2>🩺 Readiness check <span class="sub">(30 sec · auto-adjusts volume so you never overtrain, never skip)</span></h2>
    <div class="grid g3" style="margin-top:10px">
      <label class="f">Sleep last night (h)<input type="number" min="0" max="14" step="0.5" data-f="daily" data-d="${d}" data-k="sleep" value="${x.sleep??''}"></label>
      <label class="f">Muscle soreness<select data-f="daily" data-d="${d}" data-k="sore"><option value="">—</option>${[[1,'1 · Fresh'],[2,'2 · Mild'],[3,'3 · Moderate'],[4,'4 · High'],[5,'5 · Very high']].map(([v,l])=>`<option value="${v}" ${x.sore==v?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f">Energy / mood<select data-f="daily" data-d="${d}" data-k="energy"><option value="">—</option>${[[1,'1 · Drained'],[2,'2 · Low'],[3,'3 · Okay'],[4,'4 · Good'],[5,'5 · Great']].map(([v,l])=>`<option value="${v}" ${x.energy==v?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <div class="note ${lv==='full'?'g':lv==='mod'?'w':'b'}">${lv==='full'?(rd.score==null?'Fill the three fields above — default is the full plan.':'✅ <b>Green:</b> full plan. Attack it.'):lv==='mod'?'🟡 <b>Amber:</b> −1 set per exercise (already applied below). Keep loads, leave 2 reps in reserve.':'🔴 <b>Red:</b> reduced session (~60% of sets, RPE 6) applied below. Still train — just lighter. If you have fever, chest pain, or sharp pain: stop and rest.'}</div></section>`;

  /* exercises */

    h+=`<div class="ex ${all?'done':''}"><div class="ex-h"><div class="num">${i+1}</div><div><h4>${esc(e.n)}</h4><div class="meta">${e.sets} × ${esc(e.r)}${e.rest?' · rest '+e.rest+' s':''}</div></div></div>

      <div class="sets">${Array.from({length:e.sets},(_,j)=>`<button class="setb ${a[j]?'on':''}" data-a="set" data-d="${d}" data-m="${mode}" data-i="${i}" data-j="${j}" data-rest="${e.rest}" aria-label="Set ${j+1}">${a[j]?'✓':j+1}</button>`).join('')}</div>

  });
  h+=`<details><summary>❄️ Cool-down (5–8 min)</summary><ul>${COOL.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></details>`;

    <div class="stat"><span>Fibre</span><b>${r.fiber} g</b></div><div class="stat"><span>Water</span><b>${r.waterTrain} L</b></div>
    <div class="stat"><span>Rest-day kcal (weekly)</span><b>${r.rest}</b></div><div class="stat"><span>Max caffeine</span><b>${r.caff} mg</b></div></div>
  <p class="sub" style="margin-top:10px">BMR ${r.bmr} kcal · maintenance ≈ ${r.tdee} kcal · ${pf.goal==='maint'?'aiming to hold weight while improving performance':(pf.goal==='bulk'?'surplus':'deficit')+' ≈ '+Math.abs(r.pct)+' % body weight/week · estimated change in 30 days ≈ <b>'+(pf.goal==='bulk'?'+':'−')+Math.abs(r.est30)+' kg</b>'} (rough; water shifts and metabolic adaptation apply).</p>
  ${r.warn.map(w=>`<div class="note w">⚠️ ${w}</div>`).join('')}
  ${(pf.goal==='cut'&&r.pct>1)?'<div class="note b">Deficit above 1 % body-weight/week risks muscle loss. Choose "Recomposition".</div>':''}</section>`;
  /* meal split */
  const splits=[['Breakfast',.25],['Lunch',.30],['Pre/Post-workout',.15],['Dinner',.30]];
  h+=`<section class="card"><h2>🍽️ Meal split (4 feedings)</h2><p class="sub">≈0.4 g/kg protein per meal across 4 meals supports muscle protein synthesis (Schoenfeld &amp; Aragon 2018).</p>
  <div class="tw"><table><tr><th>Meal</th><th>kcal</th><th>Protein</th><th>Carbs</th><th>Fat</th></tr>${splits.map(([n,f])=>`<tr><td><b>${n}</b></td><td>${Math.round(r.kcal*f)}</td><td>${Math.round(r.prot*f)} g</td><td>${Math.round(r.carb*f)} g</td><td>${Math.round(r.fat*f)} g</td></tr>`).join('')}</table></div></section>`;

  const pb=S.pb,mi=Math.min(3,pb.meal),f=splits[mi][1];

  <div class="grid g4" style="margin-top:10px">
    <label class="f">Meal<select data-f="pb" data-k="meal">${splits.map((s,i)=>`<option value="${i}" ${mi===i?'selected':''}>${s[0]}</option>`).join('')}</select></label>
    <label class="f">Protein source<select data-f="pb" data-k="p">${opt('p',pb.p)}</select></label>
    <label class="f">Carb source<select data-f="pb" data-k="c">${opt('c',pb.c)}</select></label>
    <label class="f">Fat source<select data-f="pb" data-k="f">${opt('f',pb.f)}</select></label></div>
  <div class="grid g3" style="margin-top:12px"><div class="stat"><span>${esc(fp.n)}</span><b>${Math.round(gP)} g</b></div><div class="stat"><span>${esc(fc.n)}</span><b>${Math.round(gC)} g</b></div><div class="stat"><span>${esc(ff.n)}</span><b>${Math.round(gF)} g</b></div></div>
  <p class="sub" style="margin-top:8px">Target for this meal: ${Math.round(r.kcal*f)} kcal · ${Math.round(tp)} g P · ${Math.round(tc)} g C · ${Math.round(tf)} g F.</p></section>`;
  /* menus */
  const dn={nonveg:'Non-vegetarian',egg:'Eggetarian',veg:'Vegetarian'}[pf.diet];
  h+=`<section class="card"><h2>📅 Sample menus — ${dn}</h2><p class="sub">Rotate A/B daily, then scale portions using the plate builder. Use ≤1 tsp oil per meal; avoid deep-fried items.</p>
  ${MENUS[pf.diet].map(m=>`<h3>${m.name}</h3><div class="tw"><table>${m.meals.map(([a,b])=>`<tr><td style="width:140px"><b>${a}</b></td><td>${esc(b)}</td></tr>`).join('')}</table></div>`).join('')}</section>`;
  h+=`<section class="card"><h2>🧾 Food exchange table</h2><p class="sub">Approximate values per 100 g (USDA FoodData Central / IFCT); brands, cooking and recipes vary ±10 %.</p><div class="tw"><table><tr><th>Food</th><th>kcal</th><th>P</th><th>C</th><th>F</th></tr>
  ${FOODS.map(x=>`<tr><td>${esc(x[1])}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>${x[5]}</td></tr>`).join('')}</table></div></section>`;
  h+=`<section class="card"><h2>⏱️ Timing & supplements</h2><ul class="l">
   <li><b>Pre-workout (60–90 min before):</b> carbs + protein (e.g. banana + eggs/whey). Train with a full tank — don't skip food on heavy days.</li>
   <li><b>Post-workout (within ~2 h):</b> 25–40 g protein + carbs.</li>
   <li><b>Evidence-backed supplements only:</b> creatine monohydrate 3–5 g/day (ISSN 2017), whey if you miss protein, caffeine ≤${r.caff} mg (3 mg/kg) before training but not within 6 h of bed, vitamin D only if tested low.</li>
   <li><b>Rest days (7, 14, 21, 28):</b> eat at maintenance (${r.rest} kcal), with a bit more carbs — a short weekly diet break that helps adherence and training quality.</li></ul></section>`;
  h+=dietPrecautions();

function dietPrecautions(){
  return `<section class="card"><h2>⚠️ Diet precautions</h2><ul class="l">
  <li><b>See a doctor first</b> if you have diabetes, kidney/liver/heart disease, hypertension, thyroid problems, are pregnant/breast-feeding, under 18, over 60, on medication, or have ever had an eating disorder.</li>
  <li><b>Never eat below the calorie floor</b> the app computes (≈ your resting energy). Extreme diets cause muscle loss, low energy, hormonal disruption and gallstones.</li>
  <li><b>Pace:</b> keep weight loss within about 0.5–1 % of body weight per week. Faster loss costs lean mass (Garthe 2011; Helms 2014).</li>
  <li><b>No dehydration tricks:</b> no diuretics, laxatives, sauna suits, fat burners, "detox" teas. They are dangerous and do not burn fat.</li>
  <li><b>High protein (≤2.2 g/kg) is safe for healthy kidneys</b> (Devries 2018), but drink water; people with kidney disease must not follow it without medical advice.</li>
  <li><b>Fibre:</b> increase gradually (bloating); drink more water with fibre.</li>
  <li><b>Electrolytes:</b> don't cut salt to zero while training twice daily or sweating heavily; include fruit, dal, milk and a pinch of salt in water on heavy days.</li>
  <li><b>Alcohol:</b> avoid for 30 days; it blunts post-exercise muscle protein synthesis (Parr 2014) and wrecks sleep.</li>
  <li><b>Caffeine:</b> max 400 mg/day; none within 6 hours of bedtime (Drake 2013). Skip if you have palpitations or anxiety.</li>
  <li><b>Food safety:</b> cook eggs, chicken and fish fully; refrigerate leftovers within 2 h; wash produce.</li>
  <li><b>Warning signs (stop the deficit and eat more):</b> dizziness, fainting, heart palpitations, missed periods, constant cold, hair loss, obsessive food thoughts, mood crashes, persistent insomnia.</li>
  <li><b>After Day 30:</b> raise calories gradually (+100–150 kcal/week) to maintenance instead of rebounding. Keep strength training.</li></ul></section>`;
}

  h+=`<section class="card"><h2>📏 Measurement checkpoints</h2><p class="sub">Measure at the same time of day, relaxed, tape snug but not tight. Waist at navel, neck below larynx, hips at widest. Body-fat uses the US Navy formula (±3–4 %).</p>
  <div class="tw"><table><tr><th>Metric</th>${CHECKPOINTS.map(c=>`<th>Day ${c}</th>`).join('')}<th>Δ Day 1→latest</th></tr>
  ${MEAS.map(([k,l])=>{
    const vals=CHECKPOINTS.map(c=>k==='weight'?(D(c).weight??''):((S.meas[c]||{})[k]??''));
    const first=vals.find(v=>v!==''),last=[...vals].reverse().find(v=>v!=='');
    const delta=(first!==undefined&&last!==undefined&&first!==last)?(last-first):null;
    return `<tr><td><b>${l}</b></td>${CHECKPOINTS.map((c,i)=>`<td><input type="number" step="0.1" data-f="meas" data-c="${c}" data-k="${k}" value="${vals[i]}"></td>`).join('')}<td>${delta!==null?`<b style="color:${delta<0?'var(--a2)':'var(--a3)'}">${delta>0?'+':''}${delta.toFixed(1)}</b>`:'—'}</td></tr>`;}).join('')}
  <tr><td><b>Body fat %</b></td>${CHECKPOINTS.map(c=>{const m={...(S.meas[c]||{})};const bf=navyBF(m,pf);return `<td>${bf?bf.toFixed(1)+' %':'—'}</td>`;}).join('')}<td></td></tr>
  <tr><td><b>Lean mass (kg)</b></td>${CHECKPOINTS.map(c=>{const bf=navyBF(S.meas[c]||{},pf),w=D(c).weight;return `<td>${bf&&w?(w*(1-bf/100)).toFixed(1):'—'}</td>`;}).join('')}<td></td></tr></table></div>
  <p class="sub" style="margin-top:8px">Uses height/sex from your Diet tab profile. 📸 Also take front/side/back photos at each checkpoint (not stored here to save space).</p></section>`;
  /* bench */
  h+=`<section class="card"><h2>🏁 Performance benchmarks</h2><p class="sub">Test Day 1, Day 15 (optional) and Day 30 with the same form and rest.</p><div class="tw"><table><tr><th>Test</th><th>Day 1</th><th>Day 15</th><th>Day 30</th><th>Δ</th></tr>
  ${BENCH.map(([k,l])=>{const v=[1,15,30].map(c=>(S.bench[c]||{})[k]??'');const dl=(v[0]!==''&&v[2]!=='')?(v[2]-v[0]):null;
   return `<tr><td>${l}</td>${[1,15,30].map((c,i)=>`<td><input type="number" data-f="bench" data-c="${c}" data-k="${k}" value="${v[i]}"></td>`).join('')}<td>${dl!==null?`<b style="color:var(--a2)">${dl>0?'+':''}${dl}</b>`:'—'}</td></tr>`;}).join('')}</table></div></section>`;
  return h;
}
function drawChart(){
  const box=$('#chartbox');if(!box)return;
  const pts=[];for(let d=1;d<=30;d++){const w=parseFloat(D(d).weight);if(w>0)pts.push([d,w]);}
  if(pts.length<2){box.innerHTML='<div class="note i">Log your body weight in the Daily tracker (Today tab) for at least two days to see your trend.</div>';return;}
  const W=900,H=240,pl=44,pr=14,pt=14,pb=28;
  const ws=pts.map(p=>p[1]),mn=Math.min(...ws)-0.5,mx=Math.max(...ws)+0.5;
  const X_=d=>pl+(d-1)/29*(W-pl-pr),Y=w=>pt+(1-(w-mn)/(mx-mn))*(H-pt-pb);
  const path=pts.map((p,i)=>(i?'L':'M')+X_(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  // 7-day moving average
  const ma=pts.map(([d])=>{const win=pts.filter(p=>p[0]<=d&&p[0]>d-7);return [d,win.reduce((a,b)=>a+b[1],0)/win.length];});
  const mpath=ma.map((p,i)=>(i?'L':'M')+X_(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  let grid='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="hsl(252 20% 22%)"/><text x="${pl-6}" y="${y+4}" fill="hsl(250 14% 68%)" font-size="11" text-anchor="end">${v.toFixed(1)}</text>`;}
  for(let d=1;d<=30;d+=7)grid+=`<text x="${X_(d)}" y="${H-8}" fill="hsl(250 14% 68%)" font-size="11" text-anchor="middle">D${d}</text>`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="hsl(268,92%,68%)"/><stop offset="1" stop-color="hsl(158,84%,52%)"/></linearGradient></defs>${grid}
   <path d="${path}" fill="none" stroke="hsl(250 14% 50%)" stroke-width="1.5" stroke-dasharray="4 4"/><path d="${mpath}" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
   ${pts.map(p=>`<circle cx="${X_(p[0])}" cy="${Y(p[1])}" r="4" fill="hsl(252 30% 8%)" stroke="hsl(158,84%,52%)" stroke-width="2"><title>Day ${p[0]}: ${p[1]} kg</title></circle>`).join('')}</svg>
   <div class="sub">Dashed = daily weight · Solid gradient = 7-day average · Change: <b>${(pts[pts.length-1][1]-pts[0][1]).toFixed(1)} kg</b></div>`;
}

function rGuide(){
  const q=t=>'https://pubmed.ncbi.nlm.nih.gov/?term='+encodeURIComponent(t);
  return `<section class="card"><h2>⚖️ Realistic expectations</h2>
  <div class="note g">🎯 With strict adherence for 30 days, a realistic outcome for an average adult is roughly <b>2–5 kg of fat lost</b>, visible waist reduction (≈3–6 cm), and — especially if you are a beginner or returning — <b>0.5–1.5 kg of added muscle</b> plus large strength gains. Claims of "10 kg of fat in 30 days" are marketing: they require dangerous dehydration or extreme starvation.</div>
  <div class="note w">This app is educational, not medical advice. If you have any health condition, consult a qualified doctor (and consider a PAR-Q screening) before starting.</div></section>
  <section class="card"><h2>🛑 Training precautions</h2><ul class="l">
  <li><b>Stop immediately and seek care:</b> chest pain, fainting, severe breathlessness, numbness/tingling, sudden sharp joint pain, or dark/cola-coloured urine with severe muscle pain (possible rhabdomyolysis — an emergency).</li>
  <li><b>Muscle burn is fine; joint pain isn't.</b> Substitute the exercise (a home alternative is always available) rather than skipping the day.</li>
  <li><b>Sick?</b> Symptoms only above the neck → light session OK (use red readiness). Fever, body aches, chest symptoms → rest.</li>
  <li><b>Overtraining signs:</b> resting pulse up 5–10 bpm for 3+ days, worsening sleep, irritability, loss of strength for days, persistent soreness (Meeusen 2013). Respond by choosing red readiness and eating/sleeping more. A second rest day is better than an injury.</li>
  <li><b>Technique over load.</b> Increase weight only by 2–5 % when you hit the top of the rep range with clean form.</li>
  <li><b>Use a spotter/safety pins</b> for squat, bench and overhead pressing. Never test a 1-rep max.</li>
  <li><b>Home training safety:</b> clear space; only use furniture that is sturdy (check table/chair before inverted rows, dips); use shoes with grip for jumps; pad hard floors.</li>
  <li><b>Sleep 7–9 h</b> (Watson 2015). Sleep restriction reduced the share of weight lost as fat from 56 % to 25 % in a trial (Nedeltcheva 2010).</li>
  <li><b>Hydration:</b> pre-hydrate and sip 150–250 ml every 15–20 min in long or hot sessions (Sawka 2007).</li></ul>
  <details><summary>🧘 8-minute nightly mobility</summary><ul>${MOBILITY.map(m=>`<li>${m}</li>`).join('')}</ul></details></section>
  <section class="card"><h2>📚 Research behind every design choice</h2><p class="sub">Each claim links to a PubMed search for the paper so you can verify it yourself. Evidence quality varies; the program applies these findings pragmatically.</p>
  <div class="tw"><table><tr><th>Design decision</th><th>Source</th></tr>${REFS.map(r=>`<tr><td style="min-width:200px"><b>${esc(r[0])}</b></td><td>${esc(r[1])} <a href="${q(r[2])}" target="_blank" rel="noopener">PubMed ↗</a></td></tr>`).join('')}</table></div></section>
  <section class="card"><h2>💾 Your data</h2><p class="sub">Everything is stored in this browser (localStorage) and the app works offline. Export a backup regularly — clearing browser data deletes it.</p>
  <div class="row" style="margin-top:10px"><button class="btn pri" data-a="export">⬇ Export backup (.json)</button><label class="btn" style="cursor:pointer">⬆ Import backup<input type="file" accept="application/json" data-f="import" hidden></label><button class="btn danger" data-a="reset">🗑 Reset everything</button></div>
  <p class="sub" style="margin-top:10px" id="offline">${location.protocol.startsWith('http')?'Offline cache: active after first load (service worker). You can also "Install app" from your browser menu.':'Opened as a local file: your progress IS saved (localStorage). For full offline caching/installable app, serve the folder over http — run <code>python3 -m http.server 8000</code> inside the Transform30 folder and open http://localhost:8000.'}</p></section>
  ${dietPrecautions()}`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2600);}
function go(v){view=v;history.replaceState(null,'','#'+v);render();window.scrollTo({top:0});}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,d=+el.dataset.d;
  if(el.tagName==='A')e.preventDefault();
  switch(a){
   case 'nav':go(el.dataset.v);break;
   case 'gmode':S.gmode=el.dataset.m;S.modes={};save();render();toast(S.gmode==='gym'?'Default: gym':'Default: home workouts');break;
   case 'daymode':S.modes[d]=el.dataset.m;save();render();break;
   case 'start':S.start=todayStr();save();selDay=null;render();toast('🚀 Day 1 starts today. Go!');break;
   case 'prev':selDay=Math.max(1,(selDay??curDay())-1);render();break;
   case 'next':selDay=Math.min(30,(selDay??curDay())+1);render();break;
   case 'goto':selDay=d;view='today';history.replaceState(null,'','#today');render();window.scrollTo({top:0});break;
   case 'set':{
     const k=key(d,el.dataset.m),i=+el.dataset.i,j=+el.dataset.j;
     const o=S.done[k]=S.done[k]||{};const arr=o[i]=o[i]||[];arr[j]=!arr[j];save();
     const y=window.scrollY;render();window.scrollTo(0,y);
     if(arr[j]&&+el.dataset.rest>0)startTimer(+el.dataset.rest);
     break;}
   case 'complete':S.completed[d]=!S.completed[d];save();render();if(S.completed[d])toast('🔥 Day '+d+' complete!');break;
   case 'water':{const x=D(d);x.water=Math.max(0,(x.water||0)+ +el.dataset.v);save();const y=scrollY;render();scrollTo(0,y);break;}
   case 'skiptimer':stopTimer();break;
   case 'export':{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='transform30-backup-'+todayStr()+'.json';l.click();URL.revokeObjectURL(u);break;}
   case 'reset':if(confirm('Delete ALL progress? This cannot be undone.')){S=defState();save();selDay=null;render();toast('Reset done');}break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target,f=el.dataset.f;if(!f)return;
  const d=+el.dataset.d,val=el.type==='checkbox'?el.checked:el.value;
  switch(f){
   case 'start':S.start=el.value||null;save();render();break;
   case 'daily':{const x=D(d);x[el.dataset.k]=(el.type==='number'&&val!=='')?+val:val;save();if(['sleep','sore','energy'].includes(el.dataset.k)){const y=scrollY;render();scrollTo(0,y);}break;}
   case 'load':{const k=key(d,el.dataset.m);(S.loads[k]=S.loads[k]||{})[el.dataset.i]=val;save();break;}
   case 'restchk':(S.restchk[d]=S.restchk[d]||{})[el.dataset.i]=val;save();break;
   case 'prof':S.profile[el.dataset.k]=(['sex','goal','diet'].includes(el.dataset.k))?val:+val;save();render();break;
   case 'pb':S.pb[el.dataset.k]=el.dataset.k==='meal'?+val:val;save();render();break;
   case 'meas':{const c=el.dataset.c,k=el.dataset.k;if(k==='weight'){D(c).weight=val===''?'':+val;}else{(S.meas[c]=S.meas[c]||{})[k]=val===''?'':+val;}save();render();break;}
   case 'bench':{const c=el.dataset.c;(S.bench[c]=S.bench[c]||{})[el.dataset.k]=val===''?'':+val;save();render();break;}
   case 'import':{const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||o.v!==1)throw 0;S=Object.assign(defState(),o);save();render();toast('✅ Backup imported');}catch(_){toast('❌ Invalid backup file');}};r.readAsText(fl);break;}
  }
});
document.querySelectorAll('#nav button,#gmode button').forEach(b=>b.addEventListener('keydown',ev=>{if(ev.key==='Enter')b.click();}));
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['today','plan','diet','progress','guide'].includes(v)&&v!==view){view=v;render();}});

/* rest timer */
const tm={end:0,total:0,iv:null};
function startTimer(sec){tm.total=sec;tm.end=Date.now()+sec*1000;$('#timer').classList.add('show');if(!tm.iv)tm.iv=setInterval(tick,250);tick();}
function stopTimer(){clearInterval(tm.iv);tm.iv=null;$('#timer').classList.remove('show');}
function tick(){
  const left=Math.max(0,Math.ceil((tm.end-Date.now())/1000));
  $('#tt').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('#tbar').style.width=(100-left/tm.total*100)+'%';
  if(left<=0){beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);clearInterval(tm.iv);tm.iv=null;setTimeout(()=>{if(!tm.iv)$('#timer').classList.remove('show');},1500);}
}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.start();o.stop(c.currentTime+.6);}catch(_){}}

/* PWA: manifest (inline) + service worker (needs http/https) */
(function(){
  try{
    const icon="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a45bff"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient></defs><rect width="512" height="512" rx="110" fill="url(#g)"/><text x="256" y="350" font-size="300" text-anchor="middle">⚡</text></svg>');
    const man={name:'Transform30',short_name:'Transform30',start_url:'./index.html',display:'standalone',background_color:'#0b0a14',theme_color:'#0b0a14',icons:[{src:icon,sizes:'any',type:'image/svg+xml'}]};
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(l);
    const ai=document.createElement('link');ai.rel='icon';ai.href=icon;document.head.appendChild(ai);
  }catch(_){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
render();
