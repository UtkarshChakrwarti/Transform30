<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hunter System — 30-Day Awakening (Solo-Leveling style fitness quest)</title>
<meta name="description" content="Turn a 30-day gym + home transformation into a Solo-Leveling-style System: daily quests, stats, XP, ranks from E to Shadow Monarch, penalty quests and half-hourly alarms. Offline PWA.">
<meta name="theme-color" content="#0b0914">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080612;
  --surf:#130f24;
  --surf2:#18132d;
  --surf-raised:#1c1636;
  --surf-inset:#080610;
  --blue:#3db8ff; --blue2:#1f7bff; --cyan:#8ceaff; --violet:#9b6bff; --purple:#9b6bff; --purple-light:#c8adff; --gold:#f7c948; --red:#ff4d6d; --green:#35e0a1; --orange:#ff9f43;
  --line:rgba(155,107,255,.28); --line2:rgba(155,107,255,.12);
  --txt:#f4efff; --mut:#a699c7; --mut2:#6e628a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:'Inter',-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --serif:'Cinzel',-apple-system,Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --spring:cubic-bezier(.2,.9,.25,1.15);
  --tab:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{border-radius:0 !important;}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:var(--font);color:var(--txt);background:var(--bg);min-height:100dvh;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;touch-action:manipulation;
  padding-left:var(--sal);padding-right:var(--sar)}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:
   radial-gradient(650px 520px at 85% -5%, rgba(155,107,255,.32), transparent 70%),
   radial-gradient(600px 500px at -10% 35%, rgba(99,61,255,.24), transparent 70%),
   radial-gradient(700px 520px at 75% 70%, rgba(140,80,255,.20), transparent 70%),
   radial-gradient(550px 480px at 20% 95%, rgba(61,184,255,.18), transparent 70%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.28;
  background-image:linear-gradient(rgba(155,107,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(155,107,255,.04) 1px,transparent 1px);
  background-size:28px 28px;mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:var(--cyan)}
code{font-family:var(--mono);font-size:.85em;background:var(--surf-inset);padding:3px 7px;
  border-top:1px solid rgba(0,0,0,.85);border-left:1px solid rgba(0,0,0,.7);border-right:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);
  box-shadow:inset 1px 1px 3px var(--neu-dark)}
:focus-visible{outline:2px solid var(--purple-light);outline-offset:2px}

/* Solo Leveling Headings */
.cinzel, .large, .bigtitle, h2, .sw h2, .htitle, .bar-title, .quest-hdr{
  font-family:var(--serif)!important;
  letter-spacing:.04em;
}
.large small, .wt, .bar-chip, .pill, .tag-badge{
  font-family:var(--serif);
  letter-spacing:.12em;
  font-weight:700;
}

/* ===== Shell & App Bar ===== */
.shell{max-width:560px;margin:0 auto;min-height:100dvh;position:relative}
.bar{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:var(--sat);
  backdrop-filter:blur(28px) saturate(2);-webkit-backdrop-filter:blur(28px) saturate(2);
  background:rgba(14,10,26,.72);
  border-bottom:1px solid rgba(155,107,255,.22);
  box-shadow:0 6px 24px rgba(0,0,0,.6);
  transition:background .25s,border-color .25s}
.bar.scrolled{background:rgba(12,8,22,.88);border-bottom-color:rgba(155,107,255,.35)}
.bar-in{max-width:560px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.bar-title{font-weight:700;font-size:16px;letter-spacing:.04em;opacity:0;transition:.25s;position:absolute;left:0;right:0;text-align:center;pointer-events:none;text-transform:uppercase;color:var(--txt)}
.bar.scrolled .bar-title{opacity:1}
.bar-chip{font:700 11px var(--mono);letter-spacing:.16em;color:var(--purple-light);text-shadow:0 0 10px rgba(155,107,255,.8);text-transform:uppercase;
  background:rgba(18,13,34,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:5px 10px;
  border:1px solid rgba(155,107,255,.25);border-top:1px solid rgba(255,255,255,.15);
  box-shadow:0 2px 8px rgba(0,0,0,.4)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;position:relative;color:var(--purple-light);
  background:linear-gradient(135deg, rgba(30,22,54,.75), rgba(16,11,30,.82));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(155,107,255,.25);border-top:1px solid rgba(255,255,255,.18);
  box-shadow:0 4px 14px rgba(0,0,0,.5);
  transition:.15s var(--spring)}
.icon-btn:active{transform:translateY(1px) scale(.96);background:linear-gradient(135deg, rgba(20,14,38,.85), rgba(28,20,50,.85))}
.icon-btn svg{width:22px;height:22px}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.6s infinite}
.icon-btn .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}

/* Generous bottom padding to ensure zero cropping above floating glass dock */
main{padding:calc(var(--sat) + 54px) 14px calc(var(--tab) + var(--sab) + 120px)!important;min-height:100dvh}
.view{animation:viewin .35s var(--spring)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.large{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin:8px 2px 4px;text-transform:uppercase}
.large small{display:block;font:700 10.5px var(--mono);letter-spacing:.22em;color:var(--purple);text-transform:uppercase;margin-bottom:5px;text-shadow:0 0 12px rgba(155,107,255,.7)}
.lead{color:var(--mut);font-size:14.5px;margin:0 2px 14px}

/* Completely Squared Floating Glassmorphic Bottom Dock */
.tabbar{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 14px);max-width:480px;margin:0 auto;z-index:50;
  backdrop-filter:blur(30px) saturate(2.2);-webkit-backdrop-filter:blur(30px) saturate(2.2);
  background:rgba(18,13,34,.84);border:1px solid rgba(155,107,255,.45);border-top:1px solid rgba(255,255,255,.3);
  box-shadow:0 16px 44px rgba(0,0,0,.85), 0 0 28px rgba(155,107,255,.32), inset 0 1px 2px rgba(255,255,255,.18);
  height:var(--tab);padding:4px 8px;display:flex;align-items:center}
.tabbar-in{width:100%;height:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(200,173,255,.6);
  font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:.2s var(--spring);position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter;transition:.25s var(--spring)}
.tab.on{color:#fff;background:linear-gradient(135deg, rgba(78,44,140,.75), rgba(42,22,80,.8));
  border:1px solid rgba(185,145,255,.55);border-top:1px solid rgba(255,255,255,.3);
  box-shadow:0 4px 16px rgba(155,107,255,.45), inset 0 1px 1px rgba(255,255,255,.25)}
.tab.on svg{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(185,145,255,.9))}
.tab.on::after{display:none}
.tab:active{transform:scale(.95)}
.tab .badge-dot{position:absolute;top:5px;margin-left:14px;width:6px;height:6px;background:var(--red);box-shadow:0 0 8px var(--red)}

/* Completely Squared Glassmorphic Panels */
.sw{
  background:linear-gradient(135deg, rgba(24, 18, 48, 0.65) 0%, rgba(13, 9, 26, 0.76) 100%);
  backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);
  border:1px solid rgba(155,107,255,.24);border-top:1px solid rgba(255,255,255,.18);
  padding:18px;margin-bottom:16px;position:relative;overflow:hidden;
  box-shadow:0 12px 36px rgba(0,0,0,.55), 0 0 24px rgba(155,107,255,.12), inset 0 1px 1px rgba(255,255,255,.12);
}
.sw.warn{
  background:linear-gradient(135deg, rgba(45, 18, 30, 0.72) 0%, rgba(22, 9, 17, 0.84) 100%);
  border:1px solid rgba(255,77,109,.4);border-top:1px solid rgba(255,160,180,.35);
  box-shadow:0 16px 40px rgba(0,0,0,.6), 0 0 28px rgba(255,77,109,.26), inset 0 1px 2px rgba(255,255,255,.18);
}
.sw.gold{
  background:linear-gradient(135deg, rgba(42, 33, 14, 0.72) 0%, rgba(22, 17, 8, 0.84) 100%);
  border:1px solid rgba(247,201,72,.42);border-top:1px solid rgba(255,235,160,.35);
  box-shadow:0 16px 40px rgba(0,0,0,.6), 0 0 28px rgba(247,201,72,.24), inset 0 1px 2px rgba(255,255,255,.2);
}
.sw.violet{
  background:linear-gradient(135deg, rgba(38, 22, 72, 0.7) 0%, rgba(19, 11, 38, 0.8) 100%);
  border:1px solid rgba(155,107,255,.45);border-top:1px solid rgba(220,190,255,.35);
  box-shadow:0 16px 44px rgba(0,0,0,.6), 0 0 32px rgba(155,107,255,.3), inset 0 1px 2px rgba(255,255,255,.22);
}
.wt{font:700 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--purple-light);display:flex;align-items:center;gap:8px;margin-bottom:10px;text-shadow:0 0 10px rgba(155,107,255,.75)}
.wt::before{content:"[";color:var(--purple)}.wt::after{content:"]";color:var(--purple)}
.warn .wt{color:#ff9aac;text-shadow:0 0 10px rgba(255,77,109,.75)}.warn .wt::before,.warn .wt::after{color:var(--red)}
.gold .wt{color:var(--gold);text-shadow:0 0 10px rgba(247,201,72,.75)}.gold .wt::before,.gold .wt::after{color:var(--gold)}
.violet .wt{color:#c8adff;text-shadow:0 0 10px rgba(155,107,255,.85)}.violet .wt::before,.violet .wt::after{color:var(--purple)}
.sw h2{font-size:21px;letter-spacing:-.015em;line-height:1.2;font-weight:800}
.sw h3{font-size:14.5px;margin:12px 0 6px;font-weight:700;letter-spacing:.02em}
.sub{color:var(--mut);font-size:13.5px}
.tiny{font-size:11.5px;color:var(--mut2)}
.mono{font-family:var(--mono)}
.sep{height:1px;background:rgba(155,107,255,.15);border-bottom:1px solid rgba(255,255,255,.04);margin:14px 0}

/* Hunter Card */
.hunter{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.rankhex{width:80px;height:88px;position:relative;display:grid;place-items:center;font:800 38px var(--font);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,var(--rc,#9b6bff),rgba(12,9,20,.95) 95%);color:#fff;text-shadow:0 0 16px var(--rc,#9b6bff);
  filter:drop-shadow(-3px -3px 6px var(--neu-light)) drop-shadow(4px 4px 8px var(--neu-dark))}
.rankhex::after{content:"";position:absolute;inset:3px;clip-path:inherit;background:linear-gradient(145deg,#1b1434,#0a0715);z-index:0;
  box-shadow:inset 2px 2px 4px rgba(0,0,0,.8)}
.rankhex span{position:relative;z-index:1}
.lvl{font:800 42px var(--font);letter-spacing:-.03em;line-height:1;text-shadow:0 0 18px rgba(155,107,255,.75)}
.lvl small{font:700 10.5px var(--mono);letter-spacing:.2em;color:var(--mut);margin-right:6px}
.hname{font-weight:700;font-size:18px;letter-spacing:.02em}
.htitle{font:700 11px var(--serif);letter-spacing:.15em;color:var(--gold);text-transform:uppercase;text-shadow:0 0 10px rgba(247,201,72,.4)}

/* Neumorphic Inset Channels (Progress / Hydration / HP bars) */
.bar2{height:8px;border-radius:0 !important;background:var(--surf-inset);overflow:hidden;position:relative;
  border-top:1px solid rgba(0,0,0,.85);border-left:1px solid rgba(0,0,0,.7);border-right:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);
  box-shadow:inset 2px 2px 4px var(--neu-dark), inset -1px -1px 3px var(--neu-light)}
.bar2 i{display:block;height:100%;border-radius:0 !important;background:linear-gradient(90deg,var(--blue2),var(--cyan));box-shadow:0 0 12px rgba(61,184,255,.8);transition:width .8s var(--spring)}
.bar2.g i{background:linear-gradient(90deg,#14b87f,var(--green));box-shadow:0 0 12px rgba(53,224,161,.7)}
.bar2.r i{background:linear-gradient(90deg,#d6284a,var(--red));box-shadow:0 0 12px rgba(255,77,109,.7)}
.bar2.v i{background:linear-gradient(90deg,#7952eb,#c8adff);box-shadow:0 0 12px rgba(155,107,255,.8), 0 0 20px rgba(155,107,255,.6)}
.bar2.o i{background:linear-gradient(90deg,#e8760c,var(--gold))}
.kv{display:flex;justify-content:space-between;font:700 11.5px var(--mono);color:var(--mut);margin:6px 0 4px;letter-spacing:.04em}
.kv b{color:var(--txt)}
.stats{display:grid;gap:8px;margin-top:8px}
.stat{display:grid;grid-template-columns:44px 1fr 38px;gap:10px;align-items:center}
.stat .k{font:800 12px var(--mono);letter-spacing:.1em;color:var(--purple-light)}
.stat .n{font:800 16px var(--mono);text-align:right}
.radar{display:block;margin:4px auto 8px;max-width:280px;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}

/* Grouped Lists (Glassmorphic consoles) */
.group{background:rgba(18,13,33,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(155,107,255,.2);border-top:1px solid rgba(255,255,255,.14);
  border-radius:0 !important;overflow:hidden;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.08)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:48px;border-bottom:1px solid rgba(155,107,255,.12);border-top:1px solid rgba(255,255,255,.02)}
.row:first-child{border-top:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .lab{font-size:15px;font-weight:600}
.row .hint{font-size:12px;color:var(--mut)}
.row .xp{font:800 11.5px var(--mono);color:var(--gold);white-space:nowrap}
.row input[type=number],.row input[type=text],.row input[type=time],.row input[type=date],.row select{width:auto;max-width:140px;text-align:right;background:rgba(8,6,16,.65);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(155,107,255,.22);border-top:1px solid rgba(0,0,0,.8);
  border-radius:0 !important;padding:7px 9px;font-size:15px;outline:0;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}

/* Tactile square checkbox (Glass socket -> illuminated well) */
.chk{width:26px;height:26px;border-radius:0 !important;display:grid;place-items:center;transition:.2s var(--spring);
  color:transparent;font-weight:900;font-size:14px;flex:none;background:rgba(8,6,16,.65);
  border:1px solid rgba(155,107,255,.25);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.chk.on{background:linear-gradient(135deg, rgba(140,85,255,.85), rgba(90,45,210,.9));border-color:rgba(200,173,255,.6);color:#fff;
  box-shadow:0 0 14px rgba(155,107,255,.6), inset 0 1px 1px rgba(255,255,255,.3);transform:scale(1.04)}

/* Tactile industrial rocker switch (not round) */
.sw-toggle{position:relative;width:48px;height:24px;border-radius:0 !important;background:rgba(8,6,16,.7);
  border:1px solid rgba(155,107,255,.25);border-top:1px solid rgba(0,0,0,.8);
  transition:.25s;flex:none;box-shadow:inset 0 2px 5px rgba(0,0,0,.7)}
.sw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:0 !important;
  background:linear-gradient(135deg, rgba(50,36,85,.9), rgba(28,20,50,.95));
  border:1px solid rgba(155,107,255,.3);border-top:1px solid rgba(255,255,255,.25);
  box-shadow:0 2px 6px rgba(0,0,0,.5);transition:.25s var(--spring)}
.sw-toggle.on{background:rgba(12,35,24,.8);border-color:rgba(53,224,161,.5)}
.sw-toggle.on::after{transform:translateX(24px);background:linear-gradient(135deg, #1fd495, #14a06f);border-color:transparent;box-shadow:0 0 12px rgba(53,224,161,.75)}

/* Deep Sunken Input Wells */
label.field{display:flex;flex-direction:column;gap:5px;font:700 10.5px var(--mono);letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:rgba(8,6,16,.65);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(155,107,255,.22);border-top:1px solid rgba(0,0,0,.8);
  border-radius:0 !important;padding:10px 11px;font-size:15px;color:var(--txt);outline:0;transition:.2s;text-transform:none;letter-spacing:0;font-family:var(--font);font-weight:500;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
input:focus,select:focus,textarea:focus{border-color:rgba(155,107,255,.6);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6), 0 0 12px rgba(155,107,255,.35)}
textarea{min-height:64px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Segmented Control (Sunken trough with extruded keys) */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(8,6,16,.7);border-radius:0 !important;padding:3px;gap:3px;
  border:1px solid rgba(155,107,255,.2);border-top:1px solid rgba(0,0,0,.8);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.seg button{padding:8px 4px;border-radius:0 !important;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);transition:.2s var(--spring);min-height:34px}
.seg button.on{background:linear-gradient(135deg, rgba(65,35,115,.85), rgba(35,18,65,.9));color:var(--purple-light);
  border:1px solid rgba(155,107,255,.45);border-top:1px solid rgba(255,255,255,.25);
  box-shadow:0 3px 10px rgba(0,0,0,.4)}
.seg.home button.on{background:linear-gradient(135deg, rgba(20,60,40,.85), rgba(10,35,24,.9));color:var(--green);border-color:rgba(53,224,161,.45);box-shadow:0 0 10px rgba(53,224,161,.3)}

/* Glassmorphic Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border-radius:0 !important;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:0 16px;
  background:linear-gradient(135deg, rgba(30,22,54,.8), rgba(16,11,30,.85));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(155,107,255,.28);border-top:1px solid rgba(255,255,255,.18);
  color:var(--purple-light);box-shadow:0 4px 16px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.1);transition:.15s var(--spring)}
.btn:active{transform:translateY(1px) scale(.99);background:linear-gradient(135deg, rgba(18,12,34,.9), rgba(26,18,48,.9));box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.btn.pri{background:linear-gradient(135deg, rgba(140,85,255,.88), rgba(85,45,205,.92));
  border:1px solid rgba(200,173,255,.5);border-top:1px solid rgba(255,255,255,.45);
  color:#fff;box-shadow:0 8px 24px rgba(140,85,255,.45), inset 0 1px 2px rgba(255,255,255,.3)}
.btn.pri:active{background:linear-gradient(135deg, rgba(95,50,210,.95), rgba(70,30,175,.95))}
.btn.ok{background:linear-gradient(135deg, rgba(35,180,125,.88), rgba(18,120,80,.92));
  border:1px solid rgba(120,255,200,.5);border-top:1px solid rgba(255,255,255,.4);
  color:#fff;box-shadow:0 8px 24px rgba(53,224,161,.4), inset 0 1px 2px rgba(255,255,255,.3)}
.btn.ok:active{background:linear-gradient(135deg, rgba(22,120,85,.95), rgba(12,80,55,.95))}
.btn.red{background:linear-gradient(135deg, rgba(210,45,80,.85), rgba(140,20,50,.9));
  border:1px solid rgba(255,160,180,.45);border-top:1px solid rgba(255,255,255,.35);
  color:#fff;box-shadow:0 8px 24px rgba(255,77,109,.35), inset 0 1px 2px rgba(255,255,255,.25)}
.btn.sm{min-height:36px;font-size:12.5px;width:auto;padding:0 12px;border-radius:0 !important}
.btn:disabled,.btn[disabled]{opacity:.4;filter:grayscale(.6);pointer-events:none !important;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}.btn-row .btn{flex:1}

/* Pills and tactical tags */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:0 !important;font:700 10px var(--serif);letter-spacing:.1em;text-transform:uppercase;
  background:linear-gradient(145deg, #1d1538, #120c24);
  border-top:1px solid rgba(255,255,255,.08);border-left:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(0,0,0,.7);border-bottom:1px solid rgba(0,0,0,.85);
  color:var(--purple-light);box-shadow:-1px -1px 3px var(--neu-light), 2px 2px 4px var(--neu-dark)}
.pill.g{border-top-color:rgba(53,224,161,.5);color:var(--green)}.pill.o{border-top-color:rgba(247,201,72,.5);color:var(--gold)}.pill.r{border-top-color:rgba(255,77,109,.5);color:#ff9aac}.pill.v{border-top-color:rgba(155,107,255,.6);color:#c8adff}

.tag-badge{font:800 10px var(--mono);letter-spacing:.1em;padding:4px 6px;border-radius:0 !important;background:var(--surf-inset);
  border-top:1px solid rgba(0,0,0,.85);border-left:1px solid rgba(0,0,0,.7);border-right:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);
  color:var(--purple-light);box-shadow:inset 1px 1px 3px var(--neu-dark), inset -1px -1px 2px var(--neu-light);flex:none;min-width:44px;text-align:center}
.tag-badge.vit{color:var(--green)}
.tag-badge.str{color:var(--blue)}
.tag-badge.agi{color:var(--gold)}
.tag-badge.sen{color:var(--purple-light)}
.tag-badge.int{color:var(--cyan)}

/* Exercises & Sets (Glassmorphic cards) */
.ex{background:rgba(20, 15, 36, 0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(155,107,255,.2);border-top:1px solid rgba(255,255,255,.14);
  border-radius:0 !important;padding:14px;margin-bottom:12px;transition:.25s;
  box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.08)}
.ex.done{background:linear-gradient(135deg, rgba(14, 38, 28, 0.65), rgba(8, 22, 16, 0.75));
  border-color:rgba(53,224,161,.45);border-top-color:rgba(120,255,200,.35);
  box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(53,224,161,.22), inset 0 1px 1px rgba(255,255,255,.12)}
.ex-h{display:flex;gap:10px}
.exn{min-width:28px;height:28px;border-radius:0 !important;display:grid;place-items:center;font:800 12.5px var(--mono);background:rgba(10,7,20,.65);color:var(--purple-light);
  border:1px solid rgba(155,107,255,.25);border-top:1px solid rgba(0,0,0,.7);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.ex h4{font-size:15.5px;line-height:1.25;font-weight:700}
.meta{font:700 11.5px var(--mono);color:var(--green);margin-top:2px;letter-spacing:.04em}
.tip{font-size:12.5px;color:var(--mut);margin:8px 0 0 38px}
.tech{font-size:12px;color:var(--orange);margin:6px 0 0 38px}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0 38px}
.setb{width:42px;height:42px;border-radius:0 !important;font:800 14px var(--mono);
  background:linear-gradient(135deg, rgba(30,22,54,.8), rgba(16,11,30,.85));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(155,107,255,.28);border-top:1px solid rgba(255,255,255,.18);
  color:var(--mut);box-shadow:0 3px 8px rgba(0,0,0,.4);transition:.15s var(--spring)}
.setb:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.setb.on{background:linear-gradient(135deg, rgba(20,70,45,.9), rgba(10,40,26,.95));
  border:1px solid rgba(53,224,161,.6);border-top:1px solid rgba(140,255,210,.5);
  color:var(--green);box-shadow:0 0 12px rgba(53,224,161,.5), inset 0 1px 1px rgba(255,255,255,.25)}
.ex .load{margin:10px 0 0 38px;width:calc(100% - 38px);padding:8px 10px;font-size:14px}

/* Accordions */
details.acc{background:rgba(18,13,33,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(155,107,255,.2);border-top:1px solid rgba(255,255,255,.14);
  border-radius:0 !important;margin-bottom:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.08)}
details.acc summary{list-style:none;padding:12px 14px;font-weight:700;font-size:14px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;cursor:pointer;min-height:44px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"›";margin-left:auto;font-size:20px;color:var(--mut);transition:.2s;transform:rotate(90deg)}
details.acc[open] summary::after{transform:rotate(-90deg)}
details.acc ul,ul.l{padding:0 14px 12px 30px}
ul.l{padding:0 0 0 18px;margin-top:6px}
li{margin:4px 0;font-size:14px}
.note{padding:12px 14px;border-radius:0 !important;font-size:13px;margin:8px 0;line-height:1.45;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.note.w{background:rgba(28,21,9,.75);border:1px solid rgba(247,201,72,.35);color:#ffd875}
.note.b{background:rgba(32,10,16,.75);border:1px solid rgba(255,77,109,.35);color:#ff9aac}
.note.g{background:rgba(9,26,19,.75);border:1px solid rgba(53,224,161,.35);color:#6df0be}
.note.i{background:rgba(18,12,36,.75);border:1px solid rgba(155,107,255,.45);color:#c8adff}

/* Dungeon Map */
.floor{margin-bottom:16px}
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.node{aspect-ratio:1;border-radius:0 !important;
  background:rgba(18,13,34,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(155,107,255,.2);border-top:1px solid rgba(255,255,255,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;transition:.2s var(--spring);color:var(--mut);
  box-shadow:0 3px 8px rgba(0,0,0,.4)}
.node:active{transform:scale(.95)}
.node b{font:800 13.5px var(--mono)}
.node i{font-style:normal;font:700 9.5px var(--mono);line-height:1;letter-spacing:.04em}
.node.done{background:linear-gradient(135deg, rgba(65,35,115,.85), rgba(35,18,65,.9));
  border-color:rgba(185,145,255,.6);border-top-color:rgba(255,255,255,.3);color:var(--purple-light);
  box-shadow:0 0 14px rgba(155,107,255,.5)}
.node.cur{border-color:rgba(247,201,72,.8);border-top-color:rgba(255,240,180,.6);color:var(--gold);
  box-shadow:0 0 18px rgba(247,201,72,.5);animation:pulse 2s infinite}
.node.miss{border-color:rgba(255,77,109,.7);color:#ff9aac;background:rgba(36,12,19,.75)}
.node.lock{opacity:.45}
.node.rest{background:rgba(10,30,22,.65);border-color:rgba(53,224,161,.4)}
.node.rest.done{background:rgba(15,43,32,.85);color:var(--green);box-shadow:0 0 12px rgba(53,224,161,.45)}
.node.boss{border-color:rgba(155,107,255,.8);box-shadow:0 0 18px rgba(155,107,255,.65);color:#c8adff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

/* Tables & Stats */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;background:rgba(10,7,18,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(155,107,255,.2);border-radius:0 !important;padding:8px;margin:10px 0;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 7px;border-bottom:1px solid rgba(155,107,255,.12);border-top:1px solid rgba(255,255,255,.02);text-align:left;vertical-align:top}
th{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);border-top:0}
td input{min-width:64px;padding:6px;font-size:14px}
.bigstat{background:rgba(18,13,33,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(155,107,255,.2);border-top:1px solid rgba(255,255,255,.14);
  border-radius:0 !important;padding:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.08)}
.bigstat b{display:block;font:800 20px var(--mono);letter-spacing:-.02em}
.bigstat span{font:700 9.5px var(--mono);color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

/* Overlays & Glassmorphic Popups */
#overlay{position:fixed;inset:0;z-index:100;pointer-events:none}
.ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 14px) 14px calc(var(--sab) + 14px);pointer-events:auto;opacity:0;transition:opacity .25s}
.ovl.in{opacity:1}
.ovl.sheet{align-items:flex-end;padding:0}
.scrim{position:absolute;inset:0;background:rgba(5,3,10,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.win{position:relative;width:100%;max-width:450px;max-height:86dvh;overflow:auto;transform:scale(.94) translateY(12px);transition:transform .35s var(--spring);-webkit-overflow-scrolling:touch;
  background:linear-gradient(145deg, rgba(30, 20, 58, 0.85) 0%, rgba(14, 10, 28, 0.94) 100%) !important;
  backdrop-filter:blur(30px) saturate(2.2);-webkit-backdrop-filter:blur(30px) saturate(2.2);
  border:1px solid rgba(155,107,255,.5) !important;border-top:1px solid rgba(255,255,255,.35) !important;
  border-radius:0 !important;padding:22px;
  box-shadow:0 24px 64px rgba(0,0,0,.85), 0 0 45px rgba(155,107,255,.4), inset 0 1px 2px rgba(255,255,255,.25) !important}
.ovl.in .win{transform:none}
.ovl.sheet .win{max-width:560px;border-radius:0 !important;transform:translateY(100%);max-height:92dvh;padding-bottom:calc(var(--sab) + 40px);border-bottom:0 !important}
.ovl.sheet.in .win{transform:none}
.grab{width:36px;height:4px;border-radius:0 !important;background:rgba(155,107,255,.3);margin:0 auto 14px}
.sysmsg{font:500 14.5px/1.5 var(--mono);color:var(--txt);white-space:pre-wrap;min-height:56px}
.sysmsg b{color:var(--purple-light);text-shadow:0 0 10px rgba(155,107,255,.7)}
.caret::after{content:"▌";animation:blink 1s steps(2) infinite;color:var(--purple);margin-left:2px}
@keyframes blink{50%{opacity:0}}
.bigtitle{font:800 25px var(--serif);text-align:center;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 20px rgba(155,107,255,.9);margin:4px 0 12px}
.reward{display:flex;justify-content:space-between;align-items:baseline;padding:8px 4px;border-bottom:1px dashed var(--line2);font:700 14px var(--mono)}
.reward:last-child{border:0}
.reward b{color:var(--gold);font-size:18px}
.reward.stat b{color:var(--green)}
.banner{position:fixed;left:10px;right:10px;top:calc(var(--sat) + 8px);z-index:120;max-width:540px;margin:0 auto;transform:translateY(-140%);transition:transform .45s var(--spring);
  border-radius:0 !important;backdrop-filter:blur(28px) saturate(2);-webkit-backdrop-filter:blur(28px) saturate(2);
  box-shadow:0 16px 44px rgba(0,0,0,.75), 0 0 30px rgba(155,107,255,.35)}
.banner.in{transform:none}
.toast-root{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--sab) + 24px);z-index:110;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:linear-gradient(135deg, rgba(34, 21, 62, 0.88), rgba(18, 11, 36, 0.94));
  backdrop-filter:blur(20px) saturate(2);-webkit-backdrop-filter:blur(20px) saturate(2);
  border:1px solid rgba(155,107,255,.45);border-top:1px solid rgba(255,255,255,.3);
  color:var(--purple-light);font:700 12px var(--mono);padding:10px 16px;border-radius:0 !important;
  box-shadow:0 12px 32px rgba(0,0,0,.6), 0 0 20px rgba(155,107,255,.35);
  animation:toastin .3s var(--spring);max-width:90%;text-align:center}
.toast.g{color:var(--gold);border-top-color:rgba(247,201,72,.6)}
.toast.r{color:#ff9aac;border-top-color:rgba(255,77,109,.6)}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Rest Timer: Completely hidden when inactive (prevents peeking out at bottom) */
#timer{position:fixed;left:14px;right:14px;bottom:calc(var(--tab) + var(--sab) + 16px);z-index:60;max-width:500px;margin:0 auto;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(24px);
  transition:opacity .25s ease, transform .25s var(--spring), visibility .25s;
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:0 !important;
  background:linear-gradient(135deg, rgba(34, 21, 62, 0.9), rgba(18, 11, 36, 0.95));
  backdrop-filter:blur(24px) saturate(2); -webkit-backdrop-filter:blur(24px) saturate(2);
  border:1px solid rgba(155,107,255,.45);border-top:1px solid rgba(255,255,255,.3);
  box-shadow:0 12px 36px rgba(0,0,0,.7), 0 0 28px rgba(155,107,255,.35), inset 0 1px 1px rgba(255,255,255,.2)}
#timer.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}
#timer .tt{font:800 24px var(--mono);min-width:64px;text-shadow:0 0 12px rgba(155,107,255,.8);color:#c8adff}
#timer .bar2{flex:1}
.empty{text-align:center;color:var(--mut);padding:18px 8px}
.glowtxt{color:var(--purple-light);text-shadow:0 0 10px rgba(155,107,255,.7)}
.ach{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(155,107,255,.12);border-top:1px solid rgba(255,255,255,.02)}
.ach:first-child{border-top:0}
.ach:last-child{border-bottom:0}
.ach .em{min-width:48px;height:38px;border-radius:0 !important;display:grid;place-items:center;font:800 11px var(--mono);letter-spacing:.08em;
  background:linear-gradient(135deg, rgba(50,32,90,.8), rgba(28,18,52,.85));
  border:1px solid rgba(247,201,72,.4);border-top:1px solid rgba(255,255,255,.2);
  color:var(--gold);box-shadow:0 3px 8px rgba(0,0,0,.4);flex:none}
.ach.lock{opacity:.45}
.ach.lock .em{background:rgba(10,7,20,.6);border:1px solid rgba(155,107,255,.15);color:var(--mut2);box-shadow:none}
.ach b{font-size:14.5px}.ach span{display:block;font-size:12px;color:var(--mut)}

/* ===== Solo Leveling Reference UI Elements ===== */
/* Awakening Hero View (Screen 1) */
.awaken-hero{position:relative;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:0 !important;overflow:hidden;padding:24px 20px;margin-bottom:20px;background:#08060f;border:1px solid rgba(155,107,255,.35);box-shadow:0 0 30px rgba(155,107,255,.25),-4px -4px 10px var(--neu-light),5px 5px 14px var(--neu-dark)}
.awaken-hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0;opacity:.88;filter:contrast(1.1) brightness(.92)}
.awaken-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,9,20,.15) 0%,rgba(11,9,20,.45) 45%,rgba(11,9,20,.95) 80%,#0b0914 100%);z-index:1}
.awaken-hero-top{position:absolute;top:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;z-index:2;font-family:var(--serif);font-weight:800;font-size:15px;letter-spacing:.25em;color:#c8adff;text-shadow:0 0 16px rgba(155,107,255,.8)}
.awaken-hero-content{position:relative;z-index:2;text-align:left}
.awaken-hero-title{font-family:var(--serif);font-weight:900;font-size:27px;line-height:1.15;letter-spacing:.03em;color:#f4efff;text-shadow:0 0 20px rgba(155,107,255,.9),0 0 40px rgba(155,107,255,.4);margin-bottom:8px;text-transform:uppercase}
.awaken-hero-sub{font-size:13.5px;line-height:1.45;color:#c4b9e2;margin-bottom:20px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.awaken-hero-btn{background:linear-gradient(135deg,#a77eff,#7a4deb)!important;color:#fff!important;font-family:var(--serif)!important;font-weight:800!important;letter-spacing:.08em!important;border:1px solid rgba(255,255,255,.3)!important;box-shadow:0 0 24px rgba(155,107,255,.7),-2px -2px 6px rgba(255,255,255,.15),4px 4px 10px rgba(0,0,0,.9)!important;min-height:50px!important;border-radius:0 !important;}

/* Hologram Quest Modal Window (Screen 3) */
.quest-modal-win{border:1px solid rgba(155,107,255,.55)!important;background:linear-gradient(160deg,rgba(26,19,45,.98),rgba(12,9,20,.98))!important;box-shadow:0 0 40px rgba(155,107,255,.4),-6px -6px 18px var(--neu-light),8px 8px 24px rgba(0,0,0,.95)!important}
.quest-modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.quest-info-tag{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:0 !important;font-family:var(--serif);font-weight:800;font-size:12px;letter-spacing:.18em;color:#c8adff;border:1px solid rgba(155,107,255,.4);background:rgba(155,107,255,.12);text-shadow:0 0 10px rgba(155,107,255,.8)}
.quest-goal-title{font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:.12em;text-align:center;color:#f4efff;margin:14px 0 10px;text-shadow:0 0 16px rgba(155,107,255,.8);position:relative;display:inline-block;width:100%}
.quest-goal-title::after{content:"";display:block;width:60px;height:2px;background:#9b6bff;box-shadow:0 0 8px #9b6bff;margin:6px auto 0}
.quest-item-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid rgba(155,107,255,.15);font-size:14px}
.quest-item-row:last-child{border-bottom:0}
.quest-item-name{font-weight:600;color:#f4efff}
.quest-item-val{font-family:var(--mono);font-weight:700;color:#c8adff;letter-spacing:.05em;margin:0 12px}
.quest-warn-box{background:rgba(30,10,20,.65);border:1px solid rgba(255,77,109,.4);border-radius:0 !important;padding:10px 12px;margin-top:16px;font-size:11.5px;line-height:1.45;color:#ff9aac;text-align:center;box-shadow:inset 1px 1px 3px rgba(0,0,0,.8),0 0 12px rgba(255,77,109,.2)}

/* Section Headers (PLAN & COMPLETED) */
.section-hdr{font-family:var(--serif);font-size:13.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#c8adff;text-shadow:0 0 10px rgba(155,107,255,.6);margin:20px 4px 8px;display:flex;align-items:center;justify-content:space-between}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{.bar,.tabbar,#timer{display:none}}
</style>
</head>

    <button class="icon-btn" data-a="alarm" aria-label="System alarm settings" id="bellBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 003.4 0"/></svg>
      <span class="dot" id="bellDot" hidden></span>
    </button>
  </div></header>
  <main id="app"></main>
</div>
<nav class="tabbar" aria-label="Main"><div class="tabbar-in" id="tabs">

/* ---------- readiness + plan ---------- */
function readiness(d){
  const x=D(d);if(x.sleep==null||x.sore==null||x.energy==null||x.sleep===''||x.sore===''||x.energy==='')return {lvl:'full',score:null};
  const sl=x.sleep>=7?2:x.sleep>=6?1:0,so=x.sore<=2?2:x.sore==3?1:0,en=x.energy>=4?2:x.energy==3?1:0;
  const t=sl+so+en;return {lvl:t>=5?'full':t>=3?'mod':'low',score:t};
}
function planFor(d,mode){
  const type=typeOf(d);if(type==='rest')return {type,rest:true};
  const ph=phaseOf(d),W=WORKOUTS[type],r=readiness(d);
  const ex=W[mode].map(e=>{
    let s=e.s;
    if(ph.id===1)s=Math.max(e.s>1?2:1,s-1);
    if(ph.id>=3&&e.c)s+=1;
    if(r.lvl==='mod'&&s>1)s=Math.max(2,s-1);
    if(r.lvl==='low'&&s>1)s=Math.max(1,Math.round(s*0.6));
    const isIso=!e.c&&e.s>=2&&e.rest>0;
    return {...e,sets:s,tech:(ph.id===4&&isIso&&r.lvl==='full')};
  });
  return {type,rest:false,mode,ph,W,ex,r};
}
const plan=d=>planFor(d,dayMode(d));

/* ---------- nutrition / body maths ---------- */
function calc(p){
  const w=+p.w,h=+p.h,a=+p.age;if(!(w>20&&h>100&&a>10))return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==='male'?5:-161),tdee=bmr*(+p.act);
  const adj={cut:-0.20,recomp:-0.10,maint:0,bulk:0.08}[p.goal];
  let kcal=tdee*(1+adj);const warn=[];
  const floor=Math.max(p.sex==='male'?1500:1200,bmr*0.95);
  if(kcal<floor){kcal=floor;warn.push('Calories were raised to a safe floor (≈ your resting energy). Do not eat lower than this.');}
  kcal=Math.round(kcal/10)*10;
  const gkg={cut:2.2,recomp:2.0,maint:1.8,bulk:1.8}[p.goal],prot=Math.round(w*gkg);
  let fat=Math.round(Math.max(w*0.8,kcal*0.2/9)),carb=Math.round((kcal-prot*4-fat*9)/4);
  if(carb<w*2){carb=Math.round(w*2);fat=Math.round((kcal-prot*4-carb*4)/9);if(fat<w*0.6){fat=Math.round(w*0.6);warn.push('Macros are tight for this calorie level — consider a smaller deficit.');}}
  const weekly=(tdee-kcal)*7;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,carb,fat,fiber:Math.round(kcal/1000*14),water:+(w*0.037).toFixed(1),waterTrain:+(w*0.037+0.5).toFixed(1),
    est30:+((tdee-kcal)*30/7700).toFixed(1),pct:+(weekly/7700/w*100).toFixed(2),caff:Math.min(400,Math.round(w*3)),warn,rest:Math.round(tdee/10)*10};
}
function navyBF(m,p){
  const h=+p.h,w=+m.waist,n=+m.neck,hp=+m.hips;if(!(h&&w&&n))return null;let bf;
  if(p.sex==='male'){if(w<=n)return null;bf=495/(1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(h))-450;}
  else{if(!hp||w+hp<=n)return null;bf=495/(1.29579-0.35004*Math.log10(w+hp-n)+0.221*Math.log10(h))-450;}
  return isFinite(bf)?Math.max(2,Math.min(60,bf)):null;
}

function evalAll(){
  const pr=calc(S.profile),cd=curDay();
  let xp=0,streak=0,best=0,cleared=0,perfect=0,waterD=0,dietD=0,sleepD=0,homeClear=0,missed=0,redeemed=0;
  const st={STR:10,AGI:10,VIT:10,INT:10,SEN:10},days={};
  for(let d=1;d<=30;d++){
    const x=D(d),rest=isRest(d),done=!!S.completed[d];let dx=0,pct=0,mode=dayMode(d),subs=0;
    if(rest){
      const chk=S.restchk[d]||{},n=REST_PLAN.filter((_,i)=>chk[i]).length;
      dx+=n*12;st.VIT+=n;pct=n/REST_PLAN.length;
    }else{
      let bs=-1,bt=1,be=0;
      ['gym','home'].forEach(m=>{
        const p=planFor(d,m),a=S.done[key(d,m)]||{};let s=0,t=0,e=0;
        p.ex.forEach((ex,i)=>{const c=(a[i]||[]).slice(0,ex.sets).filter(Boolean).length;s+=c;t+=ex.sets;if(c===ex.sets&&ex.sets>0)e++;});
        if(s>bs||(s===bs&&m===dayMode(d))){bs=s;bt=t;mode=m;be=e;}
      });
      pct=bt?bs/bt:0;dx+=bs*8+be*10;
      if(typeOf(d)==='cond'){st.AGI+=bs*0.4+be*0.5;}else{st.STR+=bs*0.5+be*0.5;}
    }
    SUBQ.forEach(q=>{if(q.ok(x,pr)){dx+=q.xp;st[q.st]+=q.v;subs++;
      if(q.id==='water')waterD++;if(q.id==='diet')dietD++;if(q.id==='sleep')sleepD++;}});
    const rd=x.sleep!==undefined&&x.sleep!==''&&x.sore!==undefined&&x.sore!==''&&x.energy!==undefined&&x.energy!=='';
    if(rd)st.INT+=1.5;if(x.weight)st.INT+=1;if(x.note)st.INT+=0.5;
    const isPerfect=done&&subs===SUBQ.length;
    if(done){
      streak++;best=Math.max(best,streak);cleared++;
      dx+=(rest?60:100)+Math.min(50,5*streak);st.SEN+=2;
      if(isPerfect){dx+=100;st.SEN+=3;perfect++;}
      if(!rest&&mode==='home')homeClear++;
    }else if(d<cd&&!rest){
      streak=0;missed++;
      if(S.redeem[d]){dx+=20;redeemed++;}else dx-=40;
    }
    xp+=dx;days[d]={pct,subs,done,xp:dx,rest,perfect:isPerfect};
  }
  CHECKPOINTS.forEach(c=>{const m=S.meas[c]||{};const n=MEAS.filter(([k])=>k!=='weight'&&m[k]!==undefined&&m[k]!=='').length+(D(c).weight?1:0);if(n>=5){xp+=40;st.INT+=4;}});
  [1,15,30].forEach(c=>{const b=S.bench[c]||{};const n=BENCH.filter(([k])=>b[k]!==undefined&&b[k]!=='').length;if(n>=3){xp+=40;st.INT+=4;}});
  xp=Math.max(0,Math.round(xp));
  Object.keys(st).forEach(k=>st[k]=Math.round(st[k]));
  const level=lvlOf(xp),monarch=!!S.completed[30]&&level>=50;
  const b1=S.bench[1]||{},benchUp=BENCH.some(([k])=>[15,30].some(c=>{const v=(S.bench[c]||{})[k];return v!==undefined&&v!==''&&b1[k]!==undefined&&b1[k]!==''&&+v>+b1[k];}));
  return {xp,level,rank:rankOf(level,monarch),monarch,stats:st,streak,best,cleared,perfect,waterD,dietD,sleepD,homeClear,missed,redeemed,benchUp,days,
    cur:cumXp(level),next:cumXp(level+1)};
}

let actx=null;
function tone(f,t,dur,vol,type){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  const s=actx.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||.15,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+dur);o.start(s);o.stop(s+dur+.05);}catch(_){}}
function sfx(k){
  if(!S.alarm.sound)return;
  if(k==='tick'){tone(660,0,.12,.1);}
  else if(k==='ding'){tone(880,0,.18,.12);tone(1320,.12,.3,.12);}
  else if(k==='sys'){tone(520,0,.12,.1,'triangle');tone(780,.1,.12,.1,'triangle');tone(1040,.2,.25,.1,'triangle');}
  else if(k==='level'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.3,.12,'triangle'));}
  else if(k==='alarm'){[0,.35,.7].forEach(t=>{tone(880,t,.18,.16,'square');tone(660,t+.18,.16,.16,'square');});}
}
const buzz=p=>{if(S.alarm.vib&&navigator.vibrate)try{navigator.vibrate(p);}catch(_){}};
function toast(m,c){const r=$('#toasts'),t=document.createElement('div');t.className='toast '+(c||'');t.textContent=m;r.appendChild(t);setTimeout(()=>{t.remove();},2400);}
const reduced=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function typeInto(el,html,cb){
  // type visible characters, keep tags intact
  if(!el)return;if(reduced()){el.innerHTML=html;cb&&cb();return;}
  let i=0,out='',inTag=false;el.classList.add('caret');
  const step=()=>{
    if(i>=html.length){el.classList.remove('caret');cb&&cb();return;}
    let n=0;while(i<html.length&&n<2){const c=html[i++];out+=c;if(c==='<')inTag=true;if(c==='>')inTag=false;if(!inTag)n++;}
    el.innerHTML=out;setTimeout(step,16);};
  step();
}
let winQ=[];
function ovRoot(){return $('#overlay');}
function pushWin(fn){winQ.push(fn);if(!ovRoot().children.length)nextWin();}
function nextWin(){const f=winQ.shift();if(f)f();}
function openWin(inner,o){
  o=o||{};const w=document.createElement('div');w.className='ovl '+(o.sheet?'sheet ':'')+(o.cls||'');
  w.innerHTML=`<div class="scrim" ${o.lock?'':'data-a="closewin"'}></div><div class="win"><div class="sw ${o.tone||''}">${o.sheet?'<div class="grab"></div>':''}${inner}</div></div>`;
  ovRoot().appendChild(w);requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('in')));return w;
}
function closeWin(){
  const r=ovRoot(),l=r.lastElementChild;if(!l){nextWin();return;}
  l.classList.remove('in');setTimeout(()=>{l.remove();if(!r.children.length)nextWin();},260);
}
function sysWin(title,msgHtml,buttons,o){
  o=o||{};
  const w=openWin(`<div class="wt">${title}</div><div class="sysmsg" id="typed"></div><div class="btn-row" style="margin-top:16px" id="wbtns" ${o.noType?'':'hidden'}>${buttons}</div>`,o);
  const t=w.querySelector('#typed'),b=w.querySelector('#wbtns');
  sfx('sys');buzz([30,40,30]);
  if(o.noType){t.innerHTML=msgHtml;}else typeInto(t,msgHtml,()=>{b.hidden=false;});
  return w;
}

/* ---------- small UI helpers ---------- */
const bar=(pct,cls)=>`<div class="bar2 ${cls||''}"><i style="width:${Math.round(Math.max(0,Math.min(1,pct))*100)}%"></i></div>`;
const chk=on=>`<span class="chk ${on?'on':''}">✓</span>`;
function radar(st){
  const keys=STATS.map(s=>s[0]),max=Math.max(60,...keys.map(k=>st[k]))*1.12,cx=150,cy=128,R=92;
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [cx+R*f*Math.cos(a),cy+R*f*Math.sin(a)];};
  const ring=f=>keys.map((_,i)=>pt(i,f).map(n=>n.toFixed(1)).join(',')).join(' ');
  const poly=keys.map((k,i)=>pt(i,st[k]/max).map(n=>n.toFixed(1)).join(',')).join(' ');
  const spokes=keys.map((_,i)=>{const p=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="rgba(61,184,255,.22)"/>`;}).join('');
  const labels=keys.map((k,i)=>{const p=pt(i,1.27);return `<text x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#8ceaff">${k} ${st[k]}</text>`;}).join('');
  return `<svg class="radar" viewBox="0 0 300 260" role="img" aria-label="Stat radar"><defs><linearGradient id="rdg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ceaff" stop-opacity=".55"/><stop offset="1" stop-color="#1f7bff" stop-opacity=".35"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
   ${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="rgba(61,184,255,${f===1?.45:.2})"/>`).join('')}${spokes}
   <polygon points="${poly}" fill="url(#rdg)" stroke="#8ceaff" stroke-width="2" filter="url(#gl)"/>${labels}</svg>`;
}
function hexRank(r,size){return `<div class="rankhex" style="--rc:${r.c};${size?`width:${size}px;height:${Math.round(size*1.1)}px;font-size:${Math.round(size*.48)}px`:''}"><span>${r.k==='M'?'M':r.k}</span></div>`;}
const fmtXp=n=>n.toLocaleString('en-US');
const midnightLeft=()=>{const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.max(0,Math.floor((m-n)/60000));return Math.floor(s/60)+'h '+pad2(s%60)+'m';};

      <div class="note ${lv==='full'?'g':lv==='mod'?'w':'b'} mono">${lv==='full'?(rdn.score==null?'SCAN PENDING — default: full quest.':'STATUS GREEN — full quest.'):lv==='mod'?'STATUS AMBER — −1 set per exercise applied below.':'STATUS RED — reduced quest (~60% sets, RPE 6). Train light, never skip. Fever, chest pain or sharp pain: stop.'}</div>`;

    let planExHtml = '', compExHtml = '';
    p.ex.forEach((q,i)=>{
      const a=sd[i]||[],doneSets=a.slice(0,q.sets).filter(Boolean).length;

        <div class="ex-h">
          <div class="exn">${i+1}</div>
          <div class="grow">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <h4>${esc(q.n)}</h4>
              <span class="quest-item-val" style="font-size:13px">[ ${doneSets} / ${q.sets} ]</span>
            </div>
            <div class="meta">${q.sets} × ${esc(q.r)}${q.rest?' · rest '+q.rest+'s':''}</div>
          </div>
        </div>
        <p class="tip">${esc(q.tip)}</p>
        ${q.tech?`<p class="tech">[PEAK INTENSITY]: ${mode==='gym'?'last set → drop-set (−25% load, near failure).':'last set → rest-pause (near failure, 15 s rest, repeat twice).'}</p>`:''}
        <div class="sets">${Array.from({length:q.sets},(_,j)=>`<button class="setb ${a[j]?'on':''}" data-a="set" data-d="${d}" data-m="${mode}" data-i="${i}" data-j="${j}" data-rest="${q.rest}" aria-label="Set ${j+1}">${a[j]?'✓':j+1}</button>`).join('')}</div>
        <input class="load" type="text" placeholder="Log load / notes (e.g. 60 kg × 8, 8, 7)" data-f="load" data-d="${d}" data-m="${mode}" data-i="${i}" value="${esc(ld[i]||'')}">
      </div>`;
      if(all) compExHtml += card;
      else planExHtml += card;
    });

    h += `<div class="section-hdr"><span>PLAN</span><span class="tiny mono">[PENDING]</span></div>`;
    h += planExHtml || `<div class="empty" style="padding:12px;font-size:13px;color:var(--green)">[ALL EXERCISES IN THIS QUEST CLEARED]</div>`;
    
    h += `<div class="section-hdr"><span>COMPLETED</span><span class="tiny mono" style="color:var(--green)">[CLEARED]</span></div>`;
    h += compExHtml || `<div class="empty" style="padding:10px;font-size:12.5px;color:var(--mut2)">Complete sets in PLAN above to log clears here.</div>`;

    h+=`<details class="acc" style="margin-top:14px"><summary>[COOL-DOWN] Post-Workout Recovery (5–8 min)</summary><ul>${COOL.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></details>`;
  }
  /* water counter & sub-quests */
  const wl=x.water||0,tgt=pr?pr.waterTrain*1000:3200;
  h+=waterCounterBox(d,x,pr);
  const sq=(q,right)=>{const ok=q.ok(x,pr);return `<div class="row"><span class="tag-badge ${q.st.toLowerCase()}">${q.tag}</span><div class="grow"><div class="lab">${q.n}</div><div class="hint">${right[0]}</div></div>${right[1]}<span class="xp">+${q.xp}</span>${chk(ok)}</div>`;};
  const [Q_w,Q_isab,Q_s,Q_d,Q_gveg,Q_sl,Q_m,Q_p]=SUBQ;
  const wpct=Math.min(100,Math.round(wl/tgt*100));
  h+=`<div class="wt" style="margin:18px 4px 8px">Daily Tasks &amp; Sub-quests</div><div class="group">
    ${sq(Q_w,[`${wl.toLocaleString()} / ${tgt.toLocaleString()} mL (${wpct}%)`,`<button class="btn sm" data-a="water" data-d="${d}" data-v="250">+250</button><button class="btn sm" data-a="water" data-d="${d}" data-v="500">+500</button>`])}
    ${sq(Q_isab,['1 tbsp (7g) in warm water (morning/bedtime)',`<button class="sw-toggle ${x.isabgol?'on':''}" data-a="tog" data-d="${d}" data-k="isabgol" aria-label="Isabgol taken"></button>`])}
    ${sq(Q_s,['Walk, climb stairs, stay active',`<input type="number" inputmode="numeric" min="0" step="100" placeholder="steps" data-f="daily" data-d="${d}" data-k="steps" value="${x.steps??''}" style="max-width:96px">`])}
    ${sq(Q_d,['Followed self-cooked Indian meal plan',`<button class="sw-toggle ${x.diet?'on':''}" data-a="tog" data-d="${d}" data-k="diet" aria-label="Diet followed"></button>`])}
    ${sq(Q_gveg,['Palak, Methi, Lauki, Bhindi, Beans or Capsicum',`<button class="sw-toggle ${x.greenveg?'on':''}" data-a="tog" data-d="${d}" data-k="greenveg" aria-label="Green veggies eaten"></button>`])}
    ${sq(Q_sl,[`Logged: ${x.sleep||'—'} h (Fatigue scan)`,''])}
    ${sq(Q_m,['Nightly 8-min joint mobility routine',`<button class="sw-toggle ${x.mob?'on':''}" data-a="tog" data-d="${d}" data-k="mob" aria-label="Mobility done"></button>`])}
    ${sq(Q_p,[pr?`Target ${pr.prot}g (Chicken/Eggs/Dal)`:'Set profile in Provisions',`<input type="number" inputmode="numeric" min="0" placeholder="g" data-f="daily" data-d="${d}" data-k="prot" value="${x.prot??''}" style="max-width:84px">`])}</div>`;
  h+=`<div class="wt" style="margin:18px 4px 8px">Hunter log</div><div class="group">
    <div class="row"><span class="grow lab">Morning weight</span><input type="number" inputmode="decimal" step="0.1" placeholder="kg" data-f="daily" data-d="${d}" data-k="weight" value="${x.weight??''}"></div>
    <div class="row"><span class="grow lab">Calories eaten</span><input type="number" inputmode="numeric" step="10" placeholder="kcal" data-f="daily" data-d="${d}" data-k="kcal" value="${x.kcal??''}"></div>
    <div class="row"><span class="grow"><div class="lab">Creatine 3–5 g</div><div class="hint">Optional supplement</div></span><button class="sw-toggle ${x.creat?'on':''}" data-a="tog" data-d="${d}" data-k="creat" aria-label="Creatine taken"></button></div>
    <div class="row" style="align-items:flex-start"><textarea data-f="daily" data-d="${d}" data-k="note" placeholder="Notes: PRs, pain, cravings…" style="min-height:64px">${esc(x.note||'')}</textarea></div></div>`;
  /* clear */
  const done=!!S.completed[d],ready=dd.pct>=0.7&&d<=cd;
  h+=`<button class="btn ${done?'':ready?'ok':'dis'}" data-a="clear" data-d="${d}" style="margin-top:6px">${done?'✓ Quest cleared — tap to undo':ready?(p.rest?'Clear recovery quest':'Clear Day '+d+' quest'):(d>cd?'Gate locked':'Complete 70% of the quest ('+Math.round(dd.pct*100)+'%)')}</button>
    <p class="tiny" style="text-align:center;margin-top:8px">Clearing grants the day's bonus EXP, streak bonus and stat points.</p>`;
  return h;
}

/* ============================================================
   DUNGEON
   ============================================================ */
function rDungeon(){
  const cd=curDay(),e=ev();
  let h=`<div class="large"><small>[ Dungeon: 30-day awakening ]</small>Dungeon</div><p class="lead">Four floors. 26 quests. 4 safe zones. At the end: the Monarch's gate.</p>`;
  h+=`<div class="legend" style="display:flex;gap:12px;flex-wrap:wrap;margin:0 2px 14px" ><span class="pill">Cleared</span><span class="pill o">Today</span><span class="pill r">Failed</span><span class="pill g">Safe zone</span><span class="pill v">Boss</span></div>`;
  P.forEach((ph,fi)=>{
    const from=fi===0?1:fi===1?8:fi===2?15:22,to=fi===3?30:from+6;
    const cleared=Array.from({length:to-from+1},(_,i)=>from+i).filter(d=>S.completed[d]).length;
    h+=`<section class="sw ${fi===3?'violet':''} floor"><div class="wt">${esc(ph.name.split(' · ')[0])}</div><div class="row" style="padding:0;border:0"><div class="grow"><h2>${esc(ph.name.split(' · ')[1])}</h2><div class="sub">${ph.days} · ${ph.rir}</div></div><span class="pill ${cleared===to-from+1?'g':''}">${cleared}/${to-from+1}</span></div><p class="tiny" style="margin:6px 0 12px">${esc(FLOOR_LORE[fi])}</p>`;
    for(let w=from;w<=to;w+=7){
      h+='<div class="weekrow">';
      for(let d=w;d<w+7;d++){
        if(d>to||d>30){h+='<div></div>';continue;}
        const t=typeOf(d),dn=!!S.completed[d],miss=d<cd&&!dn&&t!=='rest',cur=d===cd&&S.start;
        const cls=['node',t==='rest'?'rest':'',dn?'done':'',miss?'miss':'',cur?'cur':'',d>cd?'lock':'',d===30?'boss':''].join(' ');
        h+=`<button class="${cls}" data-a="goto" data-d="${d}" aria-label="Day ${d} ${t==='rest'?'safe zone':WORKOUTS[t].short}"><b>${d}</b><i>${d===30?'M':t==='rest'?'REST':dn?'OK':WORKOUTS[t].code}</i></button>`;
      }
      h+='</div>';
    }
    h+='</section>';
  });
  h+=`<section class="sw"><div class="wt">Quest rotation</div><div class="tw"><table><tr><th>#</th><th>Quest</th><th>Targets</th></tr>
    <tr><td>1</td><td>Push</td><td>Chest · shoulders · triceps</td></tr><tr><td>2</td><td>Pull</td><td>Back · biceps · rear delts</td></tr><tr><td>3</td><td>Legs</td><td>Quads · glutes · calves</td></tr>
    <tr><td>4</td><td>HIIT + Core</td><td>Fat burn · abs · recovery</td></tr><tr><td>5</td><td>Upper</td><td>Shoulders · arms · V-taper</td></tr><tr><td>6</td><td>Posterior</td><td>Hamstrings · glutes · back</td></tr>
    <tr><td>7</td><td>Safe zone</td><td>Full rest</td></tr></table></div>
    <div class="note w" style="margin-top:12px">[NOTE] Six training days a week is demanding (Meeusen 2013). The weekly safe zone and the Fatigue scan exist to prevent overtraining.</div></section>`;
  return h;
}

function dietPrecautions(){

  <li><b>Warning signs — eat more &amp; stop the deficit:</b> dizziness, fainting, palpitations, missed periods, constant cold, hair loss, obsessive food thoughts, insomnia.</li>
  <li><b>After Day 30:</b> raise calories +100–150 kcal/week, don't rebound.</li></ul></section>`;
}

const NTFY='https://ntfy.sh/';
const gameDayFor=dt=>{if(!S.start)return 0;const a=new Date(S.start+'T00:00:00'),b=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());return Math.round((b-a)/864e5)+1;};
function ntfyWanted(){
  const A=S.alarm;if(!A.on||!A.ntfyOn||!A.ntfy||!S.start||!S.hunter.awakened)return [];
  const out=[],now=Date.now(),f=toMin(A.from),t=toMin(A.to),ev_=A.every;
  for(let k=0;k<3;k++){
    const base=new Date();base.setDate(base.getDate()+k);
    const gd=gameDayFor(base);if(gd<1||gd>30||S.completed[gd])continue;
    for(let m=Math.ceil(f/ev_)*ev_;m<=t;m+=ev_){

      if(ts<now+20000||ts>now+30*3600000)continue;
      out.push({id:'hq'+S.start.replace(/-/g,'')+'d'+gd+'m'+m,ts:Math.floor(ts/1000),gd});

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function ntfySync(){
  const A=S.alarm;if(ntfyBusy||!A.ntfy||!(typeof fetch==='function'))return;
  ntfyBusy=true;
  try{
    const want=ntfyWanted(),wantIds=new Set(want.map(w=>w.id)),nowS=Date.now()/1000;
    Object.keys(A.sched).forEach(id=>{if(A.sched[id]<nowS)delete A.sched[id];});
    // cancel obsolete
    for(const id of Object.keys(A.sched)){
      if(!wantIds.has(id)){try{await fetch(NTFY+encodeURIComponent(A.ntfy)+'/'+id,{method:'DELETE'});}catch(_){break;}delete A.sched[id];await sleep(120);}
    }
    let n=0;
    for(const w of want){
      if(A.sched[w.id])continue;if(++n>60)break;
      const hd={'X-Delay':String(w.ts),'X-ID':w.id,'Title':'[SYSTEM] Daily Quest incomplete','Priority':'4','Tags':'warning'};
      if(location.protocol.startsWith('http'))hd['Click']=location.origin+location.pathname;
      const r=await fetch(NTFY+encodeURIComponent(A.ntfy),{method:'POST',body:'Day '+w.gd+' quest is unfinished. Clear it before midnight or face the penalty, Hunter.',headers:hd});
      if(!r.ok){if(r.status===429)toast('ntfy rate limit — will retry later','r');break;}
      A.sched[w.id]=w.ts;await sleep(150);
    }
    save();
  }catch(e){console.warn('ntfy',e);}
  ntfyBusy=false;
}

  const gains=STATS.map(([k])=>[k,a.stats[k]-b.stats[k]]).filter(x=>x[1]>0);
  const w=openWin(`<div class="wt">Quest cleared</div><div class="bigtitle">${dd.perfect?'Perfect clear':'Quest cleared'}</div>
    <div class="reward"><span>EXP</span><b id="xpc">+0</b></div>
    ${gains.map(([k,v])=>`<div class="reward stat"><span>${k}</span><b>+${v}</b></div>`).join('')}
    <div class="reward"><span>STREAK</span><b>${e.streak} D</b></div>
    <p class="sub" style="margin:10px 0 14px;text-align:center">${dd.perfect?'Every sub-quest done. +100 EXP perfect bonus.':'Clear every sub-quest for the perfect-day bonus.'}</p>
    <button class="btn pri" data-a="closewin">Continue</button>`,{tone:'gold'});
  sfx('ding');buzz([40,60,40,60,120]);
  const el=w.querySelector('#xpc');let t0=null;const tgt=Math.max(0,dx);
  const step=ts=>{t0=t0||ts;const k=Math.min(1,(ts-t0)/900);el.textContent='+'+Math.round(tgt*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step);};
  reduced()?(el.textContent='+'+tgt):requestAnimationFrame(step);
}
function levelWin(a,b){
  const rk=rankOf(a.level,false),rankUp=a.rank!==b.rank;
  openWin(`<div class="wt">System</div><div class="bigtitle">${rankUp?'Rank up':'Level up'}</div><div style="display:grid;place-items:center;gap:10px;margin-bottom:12px">${hexRank(rk,96)}<div class="lvl"><small>LEVEL</small>${b.level} → ${a.level}</div><div class="htitle">${rk.t}</div></div>
    <button class="btn pri" data-a="closewin">Continue</button>`,{tone:rankUp?'violet':'gold'});
  sfx('level');buzz([60,60,60,60,200]);
}
function titleWin(x){
  const m=x[0]==='monarch';
  openWin(`<div class="wt">${m?'Ascension':'Title acquired'}</div><div class="bigtitle">${m?'Shadow Monarch':x[1]}</div>
    <div style="display:flex;justify-content:center;margin:8px 0 14px"><span class="pill gold" style="font-size:15px;padding:6px 16px;letter-spacing:.12em">[ ${x[3]} ]</span></div>
    <p class="sub" style="text-align:center;margin-bottom:14px">${m?'You have cleared the dungeon and risen beyond every rank. Arise.':esc(x[2])}</p><button class="btn pri" data-a="closewin">Continue</button>`,{tone:m?'violet':'gold'});
  sfx(m?'level':'ding');buzz([60,40,60]);
}
function afterChange(b,quiet){
  _ev=null;const e=ev(),newly=[];
  ACH.forEach(x=>{if(!S.ach[x[0]]&&x[4](e)){S.ach[x[0]]=Date.now();newly.push(x);}});
  if(newly.length)save();
  const a=snap();
  if(a.level>b.level||a.rank!==b.rank)pushWin(()=>levelWin(a,b));
  newly.forEach(x=>pushWin(()=>titleWin(x)));
  const dx=a.xp-b.xp;if(!quiet&&dx!==0)toast((dx>0?'+':'')+dx+' EXP',dx>0?'g':'r');
  updateBadges();
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',ev_=>{
  const el=ev_.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,d=+el.dataset.d;
  if(el.tagName==='A')ev_.preventDefault();
  const b=()=>snap();
  switch(a){
   case 'tab':if(el.dataset.v===view){window.scrollTo({top:0,behavior:'smooth'});}else{if(el.dataset.v==='quests')selDay=null;setView(el.dataset.v);}break;
   case 'goto':selDay=d;setView('quests');break;
   case 'goto-codex':S.codexTab='records';save();setView('codex');break;
   case 'prev':selDay=Math.max(1,(selDay??curDay())-1);render(true);break;
   case 'next':selDay=Math.min(30,(selDay??curDay())+1);render(true);break;
   case 'ctab':S.codexTab=el.dataset.k;save();render();break;
   case 'gmode':S.gmode=el.dataset.m;S.modes={};save();render(true);break;
   case 'daymode':{const bf=b();S.modes[d]=el.dataset.m;save();afterChange(bf,true);render(true);break;}
   case 'set-today-d2':{
     const y=new Date(Date.now()-864e5);
     S.start=y.getFullYear()+'-'+pad2(y.getMonth()+1)+'-'+pad2(y.getDate());
     selDay=2;save();render(true);sfx('level');toast('Gate Unlocked: Today is Day 2 (Pull Day)!','g');break;}
   case 'questinfo':openQuestInfoModal(d||selDay||curDay());break;
   case 'awaken':awakenStart();break;
   case 'aw-no':closeWin();pushWin(()=>sysWin('System','<b>[SYSTEM]</b>\n\nDeclined.\n\nThe System will ask again.','<button class="btn pri" data-a="aw-again">Ask again</button>',{lock:true}));break;
   case 'aw-again':closeWin();pushWin(awakenStart);break;
   case 'aw-yes':closeWin();pushWin(awakenForm);break;
   case 'aw-go':{
     const g=id=>document.getElementById(id).value,nm=g('aw-name').trim();
     if(!nm){toast('Enter a hunter name','r');break;}
     const age=+g('aw-age'),h=+g('aw-h'),w=+g('aw-w');
     if(!(age>=14&&h>=120&&w>=35)){toast('Check age, height and weight','r');break;}
     S.hunter={name:nm,awakened:true};Object.assign(S.profile,{sex:g('aw-sex'),age,h,w,goal:g('aw-goal'),diet:g('aw-diet')});
     if(!S.start)S.start=todayStr();
     save();closeWin();render();sfx('level');
     pushWin(()=>dailyArrival(curDay()));
     break;}
   case 'arrival-ok':closeWin();pushWin(()=>sysWin('System','<b>[SYSTEM]</b>\n\nEnable the <b>System Alarm</b>?\n\nYou will be reminded every 30 minutes until your quest is cleared.','<button class="btn" data-a="closewin">Later</button><button class="btn pri" data-a="alarm-open">Enable</button>',{}));break;
   case 'alarm-open':closeWin();pushWin(alarmSheet);break;
   case 'alarm':if(!ovRoot().children.length)alarmSheet();break;
   case 'closewin':closeWin();break;
   case 'set':{
     if(d>curDay()){toast('Gate locked — opens on Day '+d,'r');break;}
     const k=key(d,el.dataset.m),i=+el.dataset.i,j=+el.dataset.j,bf=b();
     const o=S.done[k]=S.done[k]||{},arr=o[i]=o[i]||[];arr[j]=!arr[j];save();
     afterChange(bf,true);render(true);
     if(arr[j]){sfx('tick');buzz(15);if(+el.dataset.rest>0)startTimer(+el.dataset.rest);}
     break;}
   case 'restchk':{if(d>curDay()){toast('Gate locked','r');break;}const bf=b(),o=S.restchk[d]=S.restchk[d]||{};o[+el.dataset.i]=!o[+el.dataset.i];save();afterChange(bf,true);render(true);sfx('tick');break;}
   case 'tog':{if(d>curDay()){toast('Gate locked','r');break;}const bf=b(),x=D(d);x[el.dataset.k]=!x[el.dataset.k];save();afterChange(bf,false);render(true);buzz(12);break;}
   case 'water':{
     if(d>curDay()){toast('Gate locked — opens on Day '+d,'r');break;}
     const bf=b(),x=D(d),delta=+el.dataset.v,prev=x.water||0;
     x.water=Math.max(0,prev+delta);
     save();afterChange(bf,true);render(true);
     sfx('tick');buzz(12);
     const tgt=calc(S.profile)?calc(S.profile).waterTrain*1000:3200;
     if(x.water>=tgt&&prev<tgt){toast('Hydration goal achieved (+30 EXP)','g');sfx('level');}
     else if(delta>0){toast('+'+delta+' mL logged ('+x.water+' mL total)');}
     break;}
   case 'water-reset':{
     if(d>curDay()){toast('Gate locked','r');break;}
     const bf=b(),x=D(d);x.water=0;
     save();afterChange(bf,true);render(true);
     toast('Water counter reset to 0 mL');buzz(15);
     break;}
   case 'pen':{const m=+el.dataset.m,i=+el.dataset.i,bf=b(),o=S.pen[m]=S.pen[m]||{};o[i]=!o[i];
     if(PEN_TASKS.every((_,k)=>o[k])){S.redeem[m]=true;toast('Penalty redeemed. +60 EXP net','g');sfx('level');}else S.redeem[m]=false;
     save();afterChange(bf,true);render(true);break;}
   case 'clear':{
     if(S.completed[d]){const bf=b();S.completed[d]=false;save();afterChange(bf,false);render(true);ntfySoon();break;}
     if(d>curDay()){toast('Gate locked — opens on Day '+d,'r');break;}
     if(!canClear(d)){toast('Complete at least 70% of the quest first','r');buzz([20,40,20]);break;}
     const bf=b();S.completed[d]=true;save();const af=snap();
     pushWin(()=>clearWin(d,bf,af));afterChange(bf,true);render(true);ntfySoon();updateBadges();
     break;}
   case 'skiptimer':stopTimer();break;
   case 'bannergo':$('#banner').classList.remove('in');selDay=null;setView('quests');break;
   case 'bannerx':$('#banner').classList.remove('in');break;
   case 'atog':{const k=el.dataset.k,A=S.alarm;
     if(k==='on'){A.on=!A.on;if(A.on){A.lastSlot=slotId(new Date());if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(()=>refreshSheet());}}
     else A[k]=!A[k];
     save();updateBadges();refreshSheet();ntfySoon();break;}
   case 'aevery':S.alarm.every=+el.dataset.v;S.alarm.lastSlot=slotId(new Date());save();refreshSheet();ntfySoon();break;
   case 'askperm':if('Notification' in window)Notification.requestPermission().then(()=>refreshSheet());break;
   case 'atest':{sfx('alarm');buzz([250,120,250]);notify('[SYSTEM] Test alert','This is how the System will warn you when your quest is incomplete.');showBanner('System alert','Test alert — the System will warn you like this.');break;}
   case 'gentopic':{const c='abcdefghjkmnpqrstuvwxyz23456789';let t='hunter-';for(let i=0;i<12;i++)t+=c[Math.floor(Math.random()*c.length)];S.alarm.ntfy=t;save();refreshSheet();ntfySoon();break;}
   case 'ntfytest':ntfyTest();break;
   case 'export':{const bl=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download='hunter-system-backup-'+todayStr()+'.json';l.click();URL.revokeObjectURL(u);break;}
   case 'reset':if(confirm('Delete ALL progress and start over? This cannot be undone.')){S=defState();save();selDay=null;render();toast('System reset');pushWin(awakenStart);}break;
  }
});
function refreshSheet(){const r=ovRoot(),l=r.lastElementChild;if(l&&l.classList.contains('sheet')){l.remove();alarmSheet();}}
document.addEventListener('change',e=>{
  const el=e.target,f=el.dataset.f;if(!f)return;
  const d=+el.dataset.d,val=el.type==='checkbox'?el.checked:el.value;
  switch(f){
   case 'start':{S.start=el.value||null;save();render(true);ntfySoon();break;}
   case 'hname':S.hunter.name=val.trim();save();break;
   case 'daily':{const bf=snap(),x=D(d);x[el.dataset.k]=(el.type==='number'&&val!=='')?+val:val;save();afterChange(bf,true);render(true);break;}
   case 'load':{const k=key(d,el.dataset.m);(S.loads[k]=S.loads[k]||{})[el.dataset.i]=val;save();break;}
   case 'prof':{const bf=snap();S.profile[el.dataset.k]=(['sex','goal','diet'].includes(el.dataset.k))?val:+val;save();afterChange(bf,true);render(true);break;}
   case 'pb':S.pb[el.dataset.k]=el.dataset.k==='meal'?+val:val;save();render(true);break;
   case 'meas':{const bf=snap(),c=el.dataset.c,k=el.dataset.k;if(k==='weight'){D(c).weight=val===''?'':+val;}else{(S.meas[c]=S.meas[c]||{})[k]=val===''?'':+val;}save();afterChange(bf,false);render(true);break;}
   case 'bench':{const bf=snap(),c=el.dataset.c;(S.bench[c]=S.bench[c]||{})[el.dataset.k]=val===''?'':+val;save();afterChange(bf,false);render(true);break;}
   case 'alarm':{S.alarm[el.dataset.k]=val;save();if(el.dataset.k!=='ntfy')S.alarm.lastSlot=slotId(new Date());ntfySoon();break;}
   case 'import':{const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!o.v)throw 0;localStorage.setItem(KEY,JSON.stringify(o));S=load();save();render();toast('Backup imported');}catch(_){toast('Invalid backup file','r');}};r.readAsText(fl);break;}
  }
});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(TABS.includes(v)&&v!==view){view=v;render();}});
window.addEventListener('scroll',()=>{$('#bar').classList.toggle('scrolled',window.scrollY>30);},{passive:true});

/* rest timer */
const tm={end:0,total:0,iv:null};
function startTimer(sec){
  tm.total=sec;tm.end=Date.now()+sec*1000;
  const el=$('#timer');if(el)el.classList.add('show');
  if(!tm.iv)tm.iv=setInterval(tick,250);
  tick();
}
function stopTimer(){
  clearInterval(tm.iv);tm.iv=null;
  const el=$('#timer');if(el)el.classList.remove('show');
}
function tick(){
  const left=Math.max(0,Math.ceil((tm.end-Date.now())/1000));
  const tt=$('#tt'),tb=$('#tbar');
  if(tt)tt.textContent=Math.floor(left/60)+':'+pad2(left%60);
  if(tb)tb.style.width=(100-left/tm.total*100)+'%';
  if(left<=0){
    sfx('ding');buzz([200,100,200]);
    clearInterval(tm.iv);tm.iv=null;
    setTimeout(()=>{if(!tm.iv){const el=$('#timer');if(el)el.classList.remove('show');}},1200);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(r=>{
    swReg=r;
    r.update().catch(()=>{});
  }).catch(()=>{});
  navigator.serviceWorker.ready.then(r=>{swReg=r;r.update().catch(()=>{});}).catch(()=>{});
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
setInterval(alarmTick,20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){alarmTick();dailyCheck();ntfySoon();}});
function dailyCheck(){
  if(!S.hunter.awakened||!S.start)return;const cd=curDay();
  if(daysSinceStart()>=1&&daysSinceStart()<=30&&!S.seen[cd]&&!ovRoot().children.length)pushWin(()=>dailyArrival(cd));
}
render();
if(!S.hunter.awakened)pushWin(awakenStart);else{dailyCheck();alarmTick();ntfySoon();}

</script>
